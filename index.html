<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>As Quatro Vontades — Duelo na Boca Seca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --sangue:#8b0000;
    --sangue-claro:#b91c1c;
    --dourado:#c9a227;
    --dourado-claro:#e8c860;
    --pedra:#3a3a3a;
    --pedra-escura:#1a1512;
    --osso:#e8e0d0;
    --verde-hp:#4a7c2f;
    --amarelo-hp:#c9a227;
    --vermelho-hp:#8b0000;
    --raiva:#a83c10;
    --raiva-claro:#e8834a;
    --foco:#3f7691;
    --foco-claro:#8fcbe8;
    --estamina:#7a8c1e;
    --estamina-claro:#c4d94a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#0a0807;
    color:var(--osso);
    font-family:'EB Garamond',serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100dvh;
    padding:12px;
    overflow:hidden;
  }
  /* ---------- CUTSCENE DE ABERTURA (v62) ---------- */
  .intro-cutscene{
    position:fixed;
    inset:0;
    background:#000;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .intro-cutscene.escondida{
    opacity:0;
    pointer-events:none;
    transition:opacity .7s ease;
  }
  #video-cutscene{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
  }
  .intro-toque{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.55);
    cursor:pointer;
    transition:opacity .4s ease;
  }
  .intro-toque.escondida{opacity:0; pointer-events:none;}
  .intro-toque-caixa{
    text-align:center;
    padding:28px 44px;
    border:1px solid var(--dourado);
    border-radius:4px;
    background:linear-gradient(165deg, rgba(28,21,15,.92), rgba(9,6,4,.95));
    box-shadow:0 8px 30px rgba(0,0,0,.7), inset 0 0 0 1px rgba(201,162,39,.2);
  }
  .intro-toque-titulo{
    font-family:'Cinzel',serif;
    font-size:22px;
    letter-spacing:2px;
    color:var(--dourado-claro);
    margin-bottom:14px;
    text-shadow:0 2px 6px rgba(0,0,0,.8);
  }
  .intro-toque-texto{
    font-family:'EB Garamond',serif;
    font-style:italic;
    font-size:15px;
    color:#c9b98a;
    animation:pulsarToque 1.8s ease-in-out infinite;
  }
  @keyframes pulsarToque{ 0%,100%{opacity:.65;} 50%{opacity:1;} }
  #pular-cutscene{
    position:absolute;
    bottom:22px;
    right:22px;
    padding:9px 18px;
    font-family:'Cinzel',serif;
    font-size:12.5px;
    letter-spacing:1px;
    color:var(--osso);
    background:rgba(10,8,6,.7);
    border:1px solid var(--dourado);
    border-radius:3px;
    cursor:pointer;
    transition:background .15s, opacity .4s ease;
  }
  #pular-cutscene:hover{background:rgba(30,24,16,.85);}
  #pular-cutscene.escondida{opacity:0; pointer-events:none;}

  .moldura{
    width:100%;
    max-width:640px;
    background:var(--pedra-escura);
    border:2px solid var(--pedra);
    box-shadow:0 0 0 1px #000, 0 24px 60px rgba(0,0,0,.7), inset 0 0 80px rgba(0,0,0,.5);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- CENA DE BATALHA ---------- */
  .cena{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background-image:url('bocaseca_v2.png');
    background-size:cover;
    background-position:center;
    overflow:hidden;
    border-bottom:2px solid #000;
  }
  .cena::after{
    content:'';
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.45) 100%);
    pointer-events:none;
  }

  .lutador{
    position:absolute;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.6));
    transition:transform .12s ease;
    image-rendering:auto;
  }
  .lutador img, .lutador video, .lutador canvas{
    position:absolute;
    inset:0;
    display:block;
    width:100%;height:100%;
    object-fit:contain;
    object-position:bottom;
    opacity:0;
    transition:opacity .18s ease;
  }
  .lutador img.ativa, .lutador video.ativa, .lutador canvas.ativa{opacity:1;}
  /* Efeitos ambiente (v42): poeira, partículas finas, bandeira rasgada.
     "fundo" fica atrás dos personagens (bandeira, rajada de poeira no chão);
     "frente" fica na frente de tudo, exceto sangue/HUD (partículas finas no ar). */
  .ambiente-camada{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }
  #ambiente-fundo{ z-index:1; }
  #ambiente-frente{ z-index:4; }

  #kronk{
    top:6%;
    right:4%;
    width:36%;
    height:62%;
    z-index:2;
  }
  #bryne{
    bottom:6%;
    left:12%;
    width:30%;
    height:92%;
    z-index:3;
  }

  /* Efeitos de sangue (v31). Camada cheia (crítico) cobre a cena inteira;
     camadas locais ficam posicionadas perto da cabeça/tronco de cada
     personagem (onde o corte visualmente "conecta"), com tamanho menor.
     Todas usam o MESMO pipeline de chroma key ao vivo dos vídeos de pose
     (canvas + vídeo oculto + configurarEfeitosSangue()), só que sem
     loop e sem troca de "pose" — é uma camada extra que aparece por cima
     de tudo e se esconde sozinha quando o vídeo termina. */
  .sangue-critico{
    position:absolute; inset:0;
    z-index:10;
    pointer-events:none;
    opacity:0;
  }
  .sangue-critico.ativa{ opacity:1; }
  .sangue-critico canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    transform:scale(1.65); /* v44: zoom pra dentro -- o sangue do vídeo já é concentrado perto do centro do quadro, ampliar dá a sensação de "voou na cara", não só uma camada de fundo */
    transform-origin:center center;
  }
  .sangue-corpo{
    position:absolute;
    z-index:6;
    pointer-events:none;
    opacity:0;
    transition:opacity .05s ease;
  }
  .sangue-corpo.ativa{ opacity:1; }
  .sangue-corpo canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
  }
  /* Posição medida via DOM real na pose de dano de cada personagem (não estimada):
     Kronk torso ~ x:77% y:30% da cena; Bryne torso ~ x:12% y:73% da cena. */
  #sangue-corpo-kronk{ top:22%; left:69%; width:16%; height:16%; }
  #sangue-corpo-bryne{ top:65%; left:5%; width:15%; height:15%; }
  /* v44: zona de "queda" -- depois do jorro do vídeo, gotas caem de verdade
     do ponto de impacto até perto do chão, em vez do sangue só sumir no
     lugar. Canvas alto e fino, do torso até perto dos pés de cada um. */
  .sangue-queda{
    position:absolute;
    z-index:6;
    pointer-events:none;
  }
  #sangue-queda-kronk{ top:33%; left:70%; width:14%; height:36%; }
  #sangue-queda-bryne{ top:76%; left:6%; width:13%; height:16%; }
  /* v48: poeira de impacto (Camada 10) -- nasce nos pés de cada personagem
     quando ele se move pra atacar, conectando o golpe ao chão do cenário. */
  .poeira-impacto{
    position:absolute;
    z-index:2;
    pointer-events:none;
  }
  #poeira-impacto-kronk{ top:58%; left:63%; width:28%; height:12%; }
  #poeira-impacto-bryne{ top:85%; left:9%; width:26%; height:11%; }

  /* Correção de tamanho aparente do Kronk por pose (v20).
     BUG CRÍTICO encontrado e corrigido na v20: da v14 até a v19, todo o
     cálculo de escala usou A = 36/62 = 0.58 como "proporção da caixa
     #kronk". Isso está ERRADO: width:36% e height:62% do #kronk são
     relativos a dimensões DIFERENTES do .cena (que tem aspect-ratio:16/9,
     não é quadrado!). A proporção real em pixels da caixa é
     (0.36*16)/(0.62*9) = 1.03 — quase quadrada, bem diferente de 0.58
     (bem mais estreita/alta). Usar o valor errado fez o cálculo achar que
     quase todo vídeo "sobrava menos altura" do que realmente sobra,
     inflando o scale necessário pra cada pose (esse é o motivo real do
     "ficou gigante"/"saiu da tela" depois da v18/v19 — não era cache).
     Refeito do zero com A correto (1.03) e revalidado com a mesma técnica
     (frame real + chroma key simulado em Python + render fora do
     navegador). Ver RESUMO_PROJETO_JOGO.md, "CORREÇÃO v20".
  */
  #kronk .pose-base{ transform:scale(1.02); transform-origin:center bottom; } /* v29: CONTINUIDADE -- o recorte anterior deixava 20px de folga entre os pés e a borda de baixo do quadro (3.6% da altura), bem mais que as outras poses (~0-2%), fazendo o Kronk "flutuar" um pouco no chão comparado às outras poses. Recortado rente aos pés (margem de 1px, igual às demais) */
  #kronk .pose-ataque{ transform:scale(1.724) translateX(-5.36%); transform-origin:center bottom; } /* v51: REVALIDADO -- reinvestigado com o critério de largura do corte (lição do v50/entrarage: corte real é largo, ponta de arma é fino). Aqui o corte confirmado tem 72px de largura (t~5.1s) -- é o corpo/cabeça mesmo, não só a maça. Mantida a escala reduzida do v47, ao contrário do pose-rageataque (que era só 1px, revertido) */ /* v47 histórico: CORREÇÃO -- varredura completa achou corte no PICO do golpe, topo chegava a -13.1px. Reduzida a escala (1.98→1.724). translateX recalculado proporcionalmente */
  #kronk .pose-dano{ transform:scale(1.87); transform-origin:center bottom; } /* v26: remedida após a limpeza universal de fundo (a vinheta de canto do v25 estava inflando ligeiramente a medição de char_h_frac); escala ajustada de 1.81 pra 1.87 */
  #bryne .pose-escudoquebra{ transform:scale(1.44); transform-origin:center bottom; } /* v39: CORREÇÃO -- a escala anterior (0.81) foi calculada usando A=1.0323 (proporção da caixa do KRONK), mas a caixa da Bryne (#bryne) tem proporção BEM diferente (medida via DOM: 0.583, não 1.0323 -- as caixas deles têm width/height% bem diferentes). Isso fazia rhf sair errado e a escala ficar pequena demais. Recalculado com a proporção real da caixa dela (0.583) */
  #bryne .pose-ataqueultimate{ transform:scale(1.47); transform-origin:center bottom; } /* v39: mesma correção do pose-escudoquebra -- escala recalculada com a proporção real da caixa da Bryne (0.583), não a do Kronk (1.0323) */
  #bryne .pose-respiro{ transform:scale(1.285); transform-origin:center bottom; } /* v58: usuário notou variação de posição comparado aos outros golpes -- investiguei a fundo (varredura completa da animação, comparado com pose-ataque). Achado: a fase ASSENTADA (depois do golpe, ~t=2.8s+) já bate bem com pose-base (22.7-23.2% contra 22.3%) -- tentei uma correção de translateX pensando que precisava, mas isso SOBRESCREVEU um alinhamento que já estava bom, empurrando pra 26%+. Revertido. O que existe de verdade é um WOBBLE (vaivém) DURANTE o golpe em si (varia entre 21.2% e 27.0%, uma faixa de 5.8pp) -- um pouco maior que o wobble do pose-ataque normal (3.7pp), mas da mesma natureza: é o braço/corpo se movendo durante o golpe, não um erro de recorte ou escala. Como é vaivém (não um deslocamento fixo), não dá pra corrigir com translateX sem estragar a fase assentada, que já está certa */ /* v55: Ataque de Respiro (golpederespiro.mp4). Vídeo veio com barras pretas nas laterais (pillarbox) -- recortado pra 1138x720 antes de processar. Calibrado pela fase assentada final (frames 60-90, char_h_frac=0.981), proporção real da caixa da Bryne (0.583). Um momento toca o topo do quadro (frames 18-27) mas com largura estreita (21-25px) -- gesto natural (braço/espada erguida), não corte real */
  #bryne .pose-morre{ transform:scale(1.48); transform-origin:center bottom; filter:brightness(1.4) contrast(1.22) drop-shadow(0 0 7px rgba(255,235,190,.35)); } /* v59: usuário reportou "metade de baixo do corpo faltando" -- investiguei a fundo e NÃO é bug de chroma (conferido pixel a pixel: o alpha está opaco corretamente). É falta de CONTRASTE: a roupa escura dela (tons ~BGR 55-75) é quase idêntica ao fundo de terra escuro do jogo naquela região (~BGR 15-70) -- ela está tecnicamente lá, só quase invisível de tão parecida com o fundo. Adicionado brightness+contrast pra destacar, mais um brilho suave nas bordas (drop-shadow claro, não escuro) pra ajudar a silhueta a se separar do fundo mesmo escuro */
  #kronk .pose-rageataque{ transform:scale(1.89); transform-origin:center bottom; } /* v51: CORREÇÃO DA CORREÇÃO -- o v47 media "corte" como qualquer topo<0px, sem checar a LARGURA daquele topo. Reinvestigando (mesma lição do entrarage v50: cabeça real teria uma faixa larga, não afunilando), descobri que em TODAS as escalas testadas (1.39 até 1.89 original) o único ponto que ultrapassa y=0 é sempre 1px de largura -- a pontinha da maça no pico do golpe, não o corpo/cabeça dele. Isso é imperceptível na prática (1 pixel, por uma fração de segundo, durante um balanço rápido) -- revertido pra escala original (1.89), que combina certinho com o rage idle. Usuário relatou corretamente que a versão reduzida (1.391) ficava "chatinha" de menor o tempo todo -- essa troca não valia a pena por causa de 1px de ponta de arma */
  #kronk .pose-ragemorre{ transform:scale(2.15) translateX(-12.11%); transform-origin:center bottom; filter:brightness(1.35) contrast(1.2) drop-shadow(0 0 7px rgba(255,235,190,.3)); } /* v60: mesma correção de contraste do v59 (Bryne) -- não é chroma quebrado (conferido: zero resíduo verde de verdade), é a roupa/pele escura dele se camuflando no fundo de terra escuro do jogo na região onde ele cai */ /* v46: CORREÇÃO -- achado corte real de cabeça (topo chegando a -9.6px, fora da cena) na postura "em pé" entre t=1.9s-3.4s, mesmo essa tendo sido a fase usada pra calibrar no v44. Reduzida a escala (2.32→2.15) pra dar margem de segurança, sacrificando um pouco a combinação com pose-dano */ /* v43/v44 histórico: [ver acima] */
  #kronk .pose-morre{ transform:scale(1.724); transform-origin:center bottom; filter:brightness(1.35) contrast(1.2) drop-shadow(0 0 7px rgba(255,235,190,.3)); } /* v60: mesma correção de contraste do v59 (Bryne) */ /* v47: CORREÇÃO -- varredura completa achou corte durante a própria queda (não a postura em pé inicial, que estava ok): o corpo cresce (efeito de perspectiva ao cair pra frente) até 253px, chegando a -12px de corte. Reduzida a escala (1.9716→1.724) pra dar margem durante a queda inteira, não só no início */ /* v45: morte no estado normal (kronknormalmorre.mp4). Calibrado pela postura EM PÉ inicial (frames 0-8, char_h_frac=0.817 -- coincidentemente quase idêntico ao neutral do pose-ataque), proporção real da caixa do Kronk (1.038). Centro horizontal já vinha bem próximo de 50% no vídeo (0.521), validado empiricamente antes de decidir se precisava de translateX */
  #kronk .pose-avalanche{ transform:scale(1.86) translateX(7.02%); transform-origin:center bottom; } /* v53: REFINADO pro máximo seguro -- usuário comparou lado a lado com pose-rageataque (confirmado perfeito) e pose-defesa (rage idle), achando o avalanche perceptivelmente menor (186px médio contra 204px do rage idle). Testei escala por escala: o corte começa de forma abrupta em ~1.87-1.88 (de 0px de corte direto pra 150px+ de largura -- não tem uma zona "quase segura" gradual, é ou seguro ou já é o corpo cortado). 1.86 é o maior valor confirmado com ZERO corte em toda a duração de 10s do vídeo. Sobe de 179.6px pra 188.3px de altura média (ainda ~8% menor que o rage idle, mas é o limite real imposto pela filmagem -- não dá pra fechar esse último gap sem cortar o corpo de verdade) */ /* v51: REINVESTIGADO e CONFIRMADO como corte real (diferente do rageataque) -- na escala original (2.142), o pior corte tem 110px de LARGURA (o corpo/cabeça dele mesmo, não uma ponta fina de arma como no rageataque) */ /* v47: CORREÇÃO -- varredura de 10s inteiros achou corte em t~6s: topo chegava a -34px */
  #kronk .pose-ragedano{ transform:scale(1.17); transform-origin:center bottom; } /* v26: sem mudança de escala, limpeza universal de fundo aplicada por segurança extra dentro do recorte já feito no v25 */
  #kronk .pose-defesa{ transform:scale(1.00); transform-origin:center bottom; } /* v29: CONTINUIDADE -- descoberto que o recorte do v22 (aprovado na época pela qualidade da chave, mas nunca medido pra centralização/contato com o chão) tinha 68px de folga até o chão (9.4% da altura) e estava 12.6% fora do centro horizontal -- exatamente os mesmos dois problemas que achei e corrigi no rageataque nesta rodada. Como o rage idle é a pose de DESCANSO pra onde todas as outras poses de fúria voltam, essa inconsistência quebrava a continuidade visual toda vez que uma pose trocava pra/da rage idle. Recortado rente ao chão e centralizado no corpo (crop=704:654:64:0 sobre o vídeo já processado), preservando a mesma qualidade de chave do v22 (chroma_sim confirma buracos residuais == fundo real, não personagem) */
  #kronk .pose-entrarage{ transform:scale(1.959); transform-origin:center bottom; } /* v50: CORREÇÃO DE VERDADE -- descoberto (graças à observação direta do usuário) que o problema nunca foi escala/posição: o VÍDEO-FONTE original (kronkentersrage_v28) tem a cabeça genuinamente cortada pela própria filmagem a partir do frame 85 de 150 (uma faixa RETA de 60-90px de largura tocando y=0, não uma silhueta afunilando -- assinatura clara de corte de quadro, não de gesto). Esse corte durava quase 2.7s (43% do vídeo!) e nenhum ajuste de CSS podia consertar, porque os pixels do topo da cabeça simplesmente não existem ali. Solução: vídeo RECORTADO (kronkentersrage_v29.webm) mantendo só os frames 0-79, antes do corte sustentado começar (o único momento em y=0 dentro dessa faixa, frames 59-65, é um gesto breve de 0.29s que cresce e diminui suavemente -- silhueta consistente com um punho erguido, não corte). Escala recalculada pelo NOVO frame final (79): char_h_frac=0.9673, centro já vem natural em 0.508 (não precisou de translateX dessa vez) */
  #kronk .pose-ragetonormal{ transform:scale(1.959); transform-origin:center bottom; } /* v50: mesmo corte, no vídeo espelhado (kronkragetonormal_v29.webm) -- mantidos os frames 70-149 dos 150 originais (os últimos 80, que correspondem aos primeiros 80 do entrarage antes do corte, invertidos) */
  #kronk .pose-pressao{ transform:scale(1.03); transform-origin:center bottom; }
  #kronk .pose-ragepressao{ transform:scale(1.02); transform-origin:center bottom; } /* v46: CORREÇÃO GRAVE -- a correção do v44 media só um instante isolado (163.6px, capturado sem perceber que esse vídeo tb tem uma "postura crescendo": começa em char_h_frac~0.72 (frames 0-8) e cresce até um platô estável ~0.92 (frames 24+, onde ele fica a maior parte do tempo). Pior ainda: o v44 tinha calculado rhf usando a fórmula errada (A/Va, assumindo vídeo mais largo que a caixa) quando na verdade Va(0.98)<A_kronk(1.038), ou seja, esse vídeo É restrito por ALTURA (rhf=1.0), não por largura. As duas contas erradas combinadas (medir a fase pequena + rhf errado) resultaram numa escala (1.303) monstruosamente grande demais -- no platô estável, o Kronk chegava a 260px de altura (contra ~205px alvo) e a cabeça cortava de vez no topo da cena (relatado pelo usuário). Recalculado do zero usando o platô estável (char_h_frac=0.92) com rhf=1.0 correto */

  /* Descoberta ao vivo (v16): quando um vídeo do Kronk demora pra carregar
     (rede lenta, ou muitos vídeos concorrendo no primeiro carregamento da
     página), o jogo troca pra uma imagem estática de fallback (ex.:
     kronkrage.png) — e essa imagem NÃO tinha nenhum ajuste de tamanho,
     então enquanto o vídeo real (com a escala calibrada acima) mostra um
     tamanho, o fallback aparece bem MAIOR (todas as imagens de fallback têm
     a mesma proporção ~0.667, o que renderiza a ~87% da altura da caixa —
     bem mais que o vídeo já reduzido do ataque/fúria). Isso explica os
     relatos contraditórios de tamanho ("ficou gigante" numa hora, "ficou
     pequeno" logo depois) — provavelmente eram o fallback e o vídeo
     alternando, não um problema real de escala. Ajustado o fallback de cada
     pose problemática pra ficar próximo do tamanho do vídeo correspondente.
  */
  #kronk .pose-ataque-fallback{ transform:scale(0.70); transform-origin:center bottom; }
  #kronk .pose-ragedano-fallback{ transform:scale(0.71); transform-origin:center bottom; }
  #kronk .pose-entrarage-fallback{ transform:scale(0.50); transform-origin:center bottom; }
  #kronk .pose-ragetonormal-fallback{ transform:scale(0.49); transform-origin:center bottom; }

  .lutador.golpeado{animation:tremer .35s ease;}
  @keyframes tremer{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-7px) rotate(-1deg);}
    40%{transform:translateX(6px) rotate(1deg);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(3px);}
  }
  .lutador.atacando{transform:translateY(-6px) scale(1.04);}

  /* ---------- EFEITOS DE IMPACTO ---------- */
  .impacto{
    position:absolute;
    z-index:7;
    pointer-events:none;
    width:120px;height:120px;
    margin:-60px 0 0 -60px;
    background:radial-gradient(circle, rgba(255,240,200,.95) 0%, rgba(255,150,60,.6) 30%, transparent 70%);
    opacity:0;
    animation:flashImpacto .4s ease-out;
  }
  @keyframes flashImpacto{
    0%{opacity:0;transform:scale(.3);}
    25%{opacity:1;transform:scale(1);}
    100%{opacity:0;transform:scale(1.5);}
  }
  .slash{
    position:absolute;
    z-index:7;
    pointer-events:none;
    width:140px;height:8px;
    margin:-4px 0 0 -70px;
    background:linear-gradient(90deg, transparent, #fff 30%, #ffe27a 50%, #fff 70%, transparent);
    border-radius:50%;
    opacity:0;
    animation:slashCorte .35s ease-out;
  }
  @keyframes slashCorte{
    0%{opacity:0;transform:scaleX(.2) rotate(-35deg);}
    40%{opacity:1;transform:scaleX(1) rotate(-35deg);}
    100%{opacity:0;transform:scaleX(1.1) rotate(-35deg);}
  }

  /* ---------- CAIXAS DE HP ---------- */
  .hpbox{
    position:absolute;
    z-index:5;
    background:linear-gradient(165deg, rgba(28,21,15,.96), rgba(9,6,4,.98));
    border:1px solid #4a3a24;
    border-radius:2px;
    padding:3px 7px 4px;
    min-width:112px;
    box-shadow:0 4px 14px rgba(0,0,0,.65), inset 0 0 0 1px rgba(201,162,39,.28), inset 0 0 16px rgba(0,0,0,.55);
  }
  .hpbox::before,.hpbox::after{
    content:'';
    position:absolute;
    width:7px;height:7px;
    border:1px solid var(--dourado);
    opacity:.55;
    pointer-events:none;
  }
  .hpbox::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .hpbox::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
  #hp-kronk{top:70%;right:5%;}
  #hp-bryne{top:18%;left:11%;}
  .hpbox .nome{
    font-family:'Cinzel',serif;
    font-weight:700;
    font-size:10.5px;
    letter-spacing:.9px;
    color:var(--dourado-claro);
    text-transform:uppercase;
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:2px;
    text-shadow:0 1px 2px rgba(0,0,0,.8);
  }
  .hpbox .faixa{font-size:7px;letter-spacing:.4px;color:#8a7a55;font-family:'Cinzel',serif;font-weight:400;}
  .hp-trilho{
    height:7px;
    background:#000;
    border:1px solid #4a3f2a;
    border-radius:1px;
    overflow:hidden;
    position:relative;
  }
  .hp-preenche{
    height:100%;
    width:100%;
    background:var(--verde-hp);
    transition:width .55s cubic-bezier(.4,0,.2,1), background .4s;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2), inset 0 -3px 6px rgba(0,0,0,.4);
  }
  .hp-num{
    text-align:right;
    font-family:'Cinzel',serif;
    font-size:8.5px;
    color:var(--osso);
    margin-top:1px;
    letter-spacing:.5px;
  }
  /* Recursos secundários: Raiva (Kronk) e Foco (Bryne) -- barra bem fina, sem label
     de texto (o nome/descrição vive no title nativo do navegador ao passar o mouse),
     só pra não engordar a caixa mais do que o necessário. */
  .rec-linha{
    margin-top:2px;
  }
  .rec-trilho{
    height:3.5px;
    background:#000;
    border:1px solid #3a2f1f;
    border-radius:1px;
    overflow:hidden;
  }
  .rec-preenche{height:100%;width:0%;transition:width .4s ease;}
  .raiva-preenche{background:linear-gradient(180deg,var(--raiva-claro),var(--raiva));box-shadow:inset 0 1px 0 rgba(255,255,255,.25);}
  .foco-preenche{background:linear-gradient(180deg,var(--foco-claro),var(--foco));box-shadow:inset 0 1px 0 rgba(255,255,255,.25);}
  .estamina-preenche{background:linear-gradient(180deg,var(--estamina-claro),var(--estamina));box-shadow:inset 0 1px 0 rgba(255,255,255,.25);}
  .rec-trilho.cheio{animation:pulsarPronto 1.15s ease-in-out infinite;}
  @keyframes pulsarPronto{
    0%,100%{box-shadow:0 0 3px 1px rgba(232,200,96,.35);}
    50%{box-shadow:0 0 9px 2px rgba(232,200,96,.85);}
  }
  /* estados ativos (pílulas), logo abaixo de cada hpbox */
  .estados{
    position:absolute;
    z-index:5;
    display:flex;
    gap:4px;
    flex-wrap:wrap;
    max-width:44%;
  }
  #est-kronk{top:calc(70% + 46px);right:5%;justify-content:flex-end;}
  #est-bryne{top:calc(18% + 51px);left:11%;}
  .pilula{
    position:relative;
    font-family:'Cinzel',serif;
    font-size:9px;
    font-weight:600;
    letter-spacing:.5px;
    padding:2px 7px;
    border-radius:10px;
    background:rgba(139,0,0,.85);
    color:var(--osso);
    border:1px solid rgba(232,200,96,.4);
    white-space:nowrap;
    cursor:help;
  }
  .pilula.bom{background:rgba(74,124,47,.85);}
  .pilula.frio{background:rgba(40,60,90,.85);}
  .pilula.ruim{background:rgba(139,0,0,.85);}
  /* tooltip explicativo ao passar o mouse (mesmo padrão visual do .h-tip das habilidades) */
  .pilula-tip{
    position:absolute;
    top:calc(100% + 8px);
    left:50%;
    transform:translateX(-50%) translateY(-6px);
    width:max-content;
    max-width:240px;
    background:#0a0806;
    border:1px solid var(--dourado);
    border-radius:4px;
    padding:11px 15px;
    font-family:'EB Garamond',serif;
    font-size:12.5px;
    line-height:1.55;
    color:var(--osso);
    box-shadow:0 6px 20px rgba(0,0,0,.8);
    opacity:0;
    pointer-events:none;
    transition:opacity .15s, transform .15s;
    z-index:30;
    text-align:left;
    white-space:normal;
  }
  .pilula-tip::after{
    content:'';
    position:absolute;
    bottom:100%;
    left:50%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-bottom-color:var(--dourado);
  }
  .pilula:hover .pilula-tip{opacity:1;transform:translateX(-50%) translateY(0);}
  #est-bryne .pilula-tip{left:0;transform:translateX(0) translateY(-6px);}
  #est-bryne .pilula:hover .pilula-tip{transform:translateX(0) translateY(0);}
  #est-bryne .pilula-tip::after{left:14px;transform:none;}
  /* Kronk: pílulas ficam perto da borda direita -- tooltip centralizado (padrão)
     vazava pra fora da .cena (texto cortado). Ancora pela direita, espelhando
     o fix já feito pro lado da Bryne. */
  #est-kronk .pilula-tip{left:auto;right:0;transform:translateX(0) translateY(-6px);}
  #est-kronk .pilula:hover .pilula-tip{transform:translateX(0) translateY(0);}
  #est-kronk .pilula-tip::after{left:auto;right:14px;transform:none;}

  /* ---------- NÚMEROS FLUTUANTES ---------- */
  .flutua{
    position:absolute;
    z-index:8;
    font-family:'Cinzel',serif;
    font-weight:700;
    font-size:30px;
    pointer-events:none;
    animation:subir 1.05s ease-out forwards;
    text-shadow:0 2px 4px #000, 0 0 12px rgba(0,0,0,.8);
  }
  .flutua.dano{color:#ff5b4a;}
  .flutua.cura{color:#7be07b;}
  .flutua.erro{color:#bcb39a;font-size:22px;}
  .flutua.crit{color:#ffd24a;font-size:40px;}
  @keyframes subir{
    0%{opacity:0;transform:translateY(0) scale(.6);}
    18%{opacity:1;transform:translateY(-14px) scale(1.15);}
    100%{opacity:0;transform:translateY(-58px) scale(1);}
  }

  /* ---------- MUTE ---------- */
  #mute{
    position:absolute;top:8px;right:8px;z-index:9;
    width:34px;height:34px;
    background:rgba(15,11,8,.85);
    border:1px solid var(--pedra);
    border-radius:2px;
    color:var(--dourado);
    font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s;
    font-family:inherit;
  }
  #mute:hover{background:var(--pedra);}

  /* ---------- LOG ---------- */
  .log{
    background:#0c0a08;
    border-bottom:2px solid #000;
    padding:10px 14px;
    height:84px;
    font-family:'Courier New',monospace;
    font-size:12.5px;
    line-height:1.55;
    color:#9a9080;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    overflow:hidden;
  }
  .log .linha{opacity:0;animation:apareceLinha .3s ease forwards;}
  .log .linha:last-child{color:var(--osso);}
  .log .linha .acerto{color:var(--dourado-claro);}
  .log .linha .ruim{color:#ff6b5a;}
  .log .linha .dado{color:#8fb3ff;font-weight:bold;}
  @keyframes apareceLinha{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- INDICADOR DE TURNO ---------- */
  .turno{
    text-align:center;
    font-family:'Cinzel',serif;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:6px;
    color:var(--dourado);
    background:#100c09;
    border-bottom:1px solid #000;
    min-height:28px;
  }

  /* ---------- HABILIDADES ---------- */
  .habilidades{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    padding:11px;
    background:linear-gradient(180deg,#161210,#0e0b09);
  }
  .hab{
    background:linear-gradient(180deg,#2a211a,#1c1611);
    border:1px solid #4a3a28;
    border-radius:3px;
    padding:13px 11px;
    cursor:pointer;
    text-align:center;
    color:var(--osso);
    font-family:inherit;
    transition:transform .1s, border-color .15s, background .15s;
    position:relative;
  }
  .hab:hover:not(:disabled){
    border-color:var(--dourado);
    background:linear-gradient(180deg,#342820,#221a13);
    transform:translateY(-1px);
  }
  .hab:active:not(:disabled){transform:translateY(1px) scale(.99);}
  .hab .h-nome{
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:14px;
    color:var(--dourado-claro);
    display:block;
  }
  /* tooltip detalhado no hover */
  .hab .h-tip{
    position:absolute;
    bottom:calc(100% + 8px);
    left:50%;
    transform:translateX(-50%) translateY(6px);
    width:max-content;
    max-width:230px;
    background:#0a0806;
    border:1px solid var(--dourado);
    border-radius:4px;
    padding:8px 11px;
    font-size:12px;
    line-height:1.45;
    color:var(--osso);
    box-shadow:0 6px 20px rgba(0,0,0,.8);
    opacity:0;
    pointer-events:none;
    transition:opacity .15s, transform .15s;
    z-index:30;
    text-align:left;
  }
  .hab .h-tip::after{
    content:'';
    position:absolute;
    top:100%;
    left:50%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:var(--dourado);
  }
  .hab .h-tip b{color:var(--dourado-claro);font-family:'Cinzel',serif;}
  .hab:hover .h-tip,
  .hab.mostrar-tip .h-tip{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  /* Grid de 2 colunas: tooltip centralizado vaza da tela em telas estreitas.
     Coluna esquerda ancora o balão à esquerda do botão, direita à direita.
     Cobre tanto :hover (desktop) quanto .mostrar-tip (toque em mobile). */
  .habilidades .hab:nth-child(odd):not(.postura):not(.especial):not(.hab-voltar) .h-tip{
    left:0; transform:translateX(0) translateY(6px);
  }
  .habilidades .hab:nth-child(odd):not(.postura):not(.especial):not(.hab-voltar):hover .h-tip,
  .habilidades .hab:nth-child(odd):not(.postura):not(.especial):not(.hab-voltar).mostrar-tip .h-tip{
    transform:translateX(0) translateY(0);
  }
  .habilidades .hab:nth-child(odd):not(.postura):not(.especial):not(.hab-voltar) .h-tip::after{
    left:24px; transform:none;
  }
  .habilidades .hab:nth-child(even):not(.postura):not(.especial):not(.hab-voltar) .h-tip{
    left:auto; right:0; transform:translateX(0) translateY(6px);
  }
  .habilidades .hab:nth-child(even):not(.postura):not(.especial):not(.hab-voltar):hover .h-tip,
  .habilidades .hab:nth-child(even):not(.postura):not(.especial):not(.hab-voltar).mostrar-tip .h-tip{
    transform:translateX(0) translateY(0);
  }
  .habilidades .hab:nth-child(even):not(.postura):not(.especial):not(.hab-voltar) .h-tip::after{
    left:auto; right:24px; transform:none;
  }
  .hab.armado{
    border-color:var(--dourado)!important;
    background:linear-gradient(180deg,#403020,#2a1f14)!important;
    box-shadow:0 0 0 2px rgba(201,162,39,.4);
  }
  .hab.especial{
    grid-column:1 / -1;
    border-color:var(--sangue);
    background:linear-gradient(180deg,#3a1410,#24100c);
  }
  .hab.especial .h-nome{color:#ff7a5a;}
  .hab.especial:hover:not(:disabled){border-color:var(--sangue-claro);background:linear-gradient(180deg,#4a1812,#2e120d);}
  .hab.especial .h-tip{border-color:var(--sangue-claro);}
  .hab.especial .h-tip::after{border-top-color:var(--sangue-claro);}
  .hab:disabled{
    opacity:.4;
    cursor:not-allowed;
    filter:grayscale(.6);
  }
  .hab .recarga{
    position:absolute;top:5px;right:8px;
    font-family:'Cinzel',serif;font-size:10px;color:var(--sangue-claro);font-weight:700;
  }
  .hab .recarga.pronto{color:var(--foco-claro);text-shadow:0 0 6px rgba(143,203,232,.7);}
  .hab.postura{grid-column:1/-1;}
  .hab.mira{border-color:var(--dourado);}
  .hab-voltar{
    grid-column:1/-1;
    background:transparent;
    border:1px dashed #4a3a28;
    color:#8a7a55;
    font-family:'Cinzel',serif;
    font-size:12px;
    padding:8px;
    cursor:pointer;
  }
  .hab-voltar:hover{color:var(--osso);border-color:var(--dourado);}
  .tip-foco{color:var(--foco-claro)!important;}

  /* ---------- CUTSCENE DE ULTIMATE ---------- */
  .cutscene-ultimate{
    position:absolute;inset:0;z-index:16;
    background:#000;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
    overflow:hidden;
  }
  .cutscene-ultimate.ativa{opacity:1;}
  .cutscene-ultimate img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    opacity:0;
    transform:scale(1.04);
    transition:opacity .35s ease .1s, transform .9s ease .1s;
  }
  .cutscene-ultimate.ativa img{opacity:1;transform:scale(1);}
  .cutscene-titulo{
    position:relative;
    z-index:1;
    font-family:'Cinzel',serif;
    font-weight:700;
    font-size:clamp(20px,5vw,34px);
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--dourado-claro);
    text-shadow:0 0 14px rgba(0,0,0,.9), 0 0 28px rgba(201,162,39,.5);
    opacity:0;
    transform:translateY(8px);
    transition:opacity .3s ease .35s, transform .3s ease .35s;
  }
  .cutscene-ultimate.ativa .cutscene-titulo{opacity:1;transform:translateY(0);}

  /* ---------- TELA FINAL ---------- */
  .fim{
    position:absolute;inset:0;z-index:20;
    background:rgba(8,6,5,.94);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    animation:fadeFim .8s ease;
  }
  @keyframes fadeFim{from{opacity:0;}to{opacity:1;}}
  .fim h2{
    font-family:'Cinzel',serif;
    font-weight:700;
    font-size:24px;
    letter-spacing:2px;
    margin-bottom:14px;
    text-transform:uppercase;
  }
  .fim.vitoria h2{color:var(--dourado-claro);}
  .fim.derrota h2{color:var(--sangue-claro);}
  .fim p{
    font-size:16px;font-style:italic;color:#bcb39a;
    max-width:340px;margin-bottom:24px;line-height:1.5;
  }
  .fim button{
    font-family:'Cinzel',serif;font-weight:600;font-size:14px;letter-spacing:1px;
    background:linear-gradient(180deg,#2a211a,#1c1611);
    border:1px solid var(--dourado);
    color:var(--dourado-claro);
    padding:12px 28px;border-radius:3px;cursor:pointer;
    transition:background .15s;text-transform:uppercase;
  }
  .fim button:hover{background:var(--pedra);}

  /* Pontuação final (v56) -- cada minigame do universo gera pontos; aqui é
     o HP restante da Bryne convertido numa pontuação de 0 a 1000. */
  .pontuacao-bloco{
    position:relative;
    margin-bottom:26px;
    padding:14px 34px 16px;
    background:linear-gradient(165deg, rgba(28,21,15,.9), rgba(9,6,4,.94));
    border:1px solid var(--dourado);
    border-radius:3px;
    box-shadow:0 4px 18px rgba(0,0,0,.6), inset 0 0 0 1px rgba(201,162,39,.25);
    opacity:0;
    transform:translateY(10px) scale(.96);
    animation:pontuacaoEntra .5s ease .5s forwards;
  }
  @keyframes pontuacaoEntra{ to{opacity:1; transform:translateY(0) scale(1);} }
  .pontuacao-bloco::before,.pontuacao-bloco::after{
    content:'';
    position:absolute;
    width:8px;height:8px;
    border:1px solid var(--dourado);
    opacity:.6;
  }
  .pontuacao-bloco::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .pontuacao-bloco::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
  .pontuacao-label{
    font-family:'Cinzel',serif;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#a8955f;
    margin-bottom:4px;
  }
  .pontuacao-numero{
    font-family:'Cinzel',serif;
    font-weight:700;
    font-size:40px;
    letter-spacing:1px;
    color:var(--dourado-claro);
    text-shadow:0 0 18px rgba(201,162,39,.45), 0 2px 4px rgba(0,0,0,.8);
    font-variant-numeric:tabular-nums;
  }
  .pontuacao-detalhe{
    font-family:'EB Garamond',serif;
    font-size:12.5px;
    color:#8a7a5f;
    margin-top:4px;
    font-style:italic;
  }

  .moldura.abala{animation:abalo .4s ease;}
  @keyframes abalo{
    0%,100%{transform:translate(0,0);}
    25%{transform:translate(-3px,2px);}
    50%{transform:translate(3px,-2px);}
    75%{transform:translate(-2px,-1px);}
  }

  @media (max-width:480px){
    body{padding:0;}
    .moldura{max-width:100%;height:100dvh;border:none;justify-content:space-between;}
    .hpbox{min-width:128px;padding:5px 8px 7px;}
    .hpbox .nome{font-size:11px;}
    .hab .h-nome{font-size:12.5px;}
    .hab .h-desc{font-size:10.5px;}
    .log{height:74px;font-size:11.5px;}
  }
</style>
</head>
<body>
<div class="intro-cutscene" id="intro-cutscene">
  <video id="video-cutscene" src="cutscene1_web.mp4" playsinline></video>
  <div class="intro-toque" id="intro-toque">
    <div class="intro-toque-caixa">
      <div class="intro-toque-titulo">As Quatro Vontades</div>
      <div class="intro-toque-texto">Toque para começar</div>
    </div>
  </div>
  <button id="pular-cutscene">Pular ›</button>
</div>
<div class="moldura" id="moldura">

  <div class="cena" id="cena">
    <canvas class="ambiente-camada" id="ambiente-fundo"></canvas>
    <button id="mute" aria-label="Silenciar música">♪</button>

    <div class="hpbox" id="hp-kronk">
      <div class="nome"><span>Kronk</span><span class="faixa">veterano</span></div>
      <div class="hp-trilho"><div class="hp-preenche" id="bar-kronk"></div></div>
      <div class="hp-num" id="num-kronk">80 / 80</div>
      <div class="rec-linha" title="Raiva: sobe quando Kronk leva dano, desce quando ele não pressiona Bryne. Cheia libera a Fúria.">
        <div class="rec-trilho" id="trilho-raiva"><div class="rec-preenche raiva-preenche" id="bar-raiva"></div></div>
      </div>
    </div>

    <div class="hpbox" id="hp-bryne">
      <div class="nome"><span>Bryne</span><span class="faixa">lendária</span></div>
      <div class="hp-trilho"><div class="hp-preenche" id="bar-bryne"></div></div>
      <div class="hp-num" id="num-bryne">65 / 65</div>
      <div class="rec-linha" title="Foco: sobe quando Bryne acerta Kronk, desce quando ela leva dano. Cheio libera A Lâmina.">
        <div class="rec-trilho" id="trilho-foco"><div class="rec-preenche foco-preenche" id="bar-foco"></div></div>
      </div>
      <div class="rec-linha" title="Estamina: regenera um pouco a cada turno. Estocada e A Lâmina custam mais do que regenera por turno.">
        <div class="rec-trilho" id="trilho-estamina"><div class="rec-preenche estamina-preenche" id="bar-estamina"></div></div>
      </div>
    </div>

    <div class="estados" id="est-kronk"></div>
    <div class="estados" id="est-bryne"></div>

    <canvas class="ambiente-camada" id="ambiente-frente"></canvas>

<script>
"use strict";

/* ====================================================================
   AS QUATRO VONTADES — DUELO NA BOCA SECA
   Bryne (jogador) vs Kronk (IA) — sistema D20
   ==================================================================== */

const EH_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
// Versão de build: mude este valor a cada atualização de vídeo/áudio para forçar
// o navegador e a CDN do GitHub Pages a buscarem os arquivos novos (evita cache antigo)
const BUILD_VERSION = 'v62';
function cb(url){ return url + '?' + BUILD_VERSION; }
document.getElementById('bgm').src = cb('Duty_Calls_-_Rod_Kim.mp3');
const DELAY_IMPACTO = 900; // Bryne: tempo entre animação e impacto
const DELAY_IMPACTO_KRONK = 2800; // Kronk: a maça só desce perto do fim do vídeo
const ESCUDO_MAX = 10; // v55: era 22 -- usuário achou "vida demais", reduzido pra 10. Agora dano excedente (acima da vida restante do escudo) vira dano real em Bryne, ver aplicarDanoBryne
const CUTSCENE_DURATION = 1000; // ms que a arte de ultimate fica na tela antes de cortar pro ataque

/* Cutscene de ultimate (v34): fade pra preto -> arte cinematográfica em tela cheia ->
   nome da habilidade -> som metálico -> corta pro ataque normal. Chama callback()
   quando termina, pra quem chamou prosseguir com a resolução real do ataque. */
// Pré-carrega as duas artes de ultimate assim que o jogo abre, pra troca de
// <img src> na cutscene ser instantânea (sem isso, o navegador podia manter
// a imagem ANTERIOR visível por um instante enquanto a nova ainda carrega —
// dava a impressão de "ver a arte errada" por uma fração de segundo).
const cutscenePreload = {
  bryne: Object.assign(new Image(), {src:'bryneULTIMATE.jpg'}),
  kronk: Object.assign(new Image(), {src:'kronkinrageULTIMATE.jpg'}),
};

function tocarCutsceneUltimate(quem, nomeHab, callback){
  const overlay = document.getElementById('cutscene-ultimate');
  const img = document.getElementById('cutscene-img');
  const titulo = document.getElementById('cutscene-titulo');
  const src = quem==='bryne' ? 'bryneULTIMATE.jpg' : 'kronkinrageULTIMATE.jpg';
  img.src = src;
  titulo.textContent = nomeHab;
  overlay.classList.add('ativa');
  som('metalico');
  setTimeout(()=>{
    overlay.classList.remove('ativa');
    callback();
  }, CUTSCENE_DURATION);
}

const d20 = () => Math.floor(Math.random()*20)+1;
const clamp = (v,min,max) => Math.max(min,Math.min(max,v));

let S; // estado global

function novoEstado(){
  return {
    bryne:{hp:65,max:65,atk:3,foco:0,focoMax:100,estamina:100,estaminaMax:100},
    kronk:{hp:80,max:80,atk:4,defBase:11,_emRage:false,raiva:0,raivaMax:100,escudoAlvoHP:0},
    ef:{
      terreno:false,   // Bryne: próximo ataque inimigo com desvantagem + contra-ataque se errar
      leitura:false,   // Bryne: próximo ataque dela com vantagem
      paredeAtiva:false,// Bryne: postura de escudo (substitui o antigo "reduz 6 de dano")
      preso:false,     // Bryne presa: próximo ataque de Kronk acerta automático
      furia:0,         // Kronk: turnos restantes de fúria (+2 dano, def 9)
      avalancheUsada:false, // Avalanche só 1x por ativação de Fúria
      peso:false,      // Kronk: se Bryne atacar e errar, contra-ataca 6
      atordoa:false,   // Bryne perde o próximo turno
      atordoaKronk:false, // Kronk perde o próximo turno (escudo quebrado por ele mesmo -- reservado)
      macaCD:0,        // recarga Maça para Cima
      sangra:0,        // turnos de sangramento em Kronk (1d4/turno)
      bracoFerido:0,   // turnos: ataques de Kronk causam -2 de dano
      pernaFerida:0    // turnos: ataques de Kronk com -3 pra acertar
    },
    escudoHP:0,        // vida do escudo de Bryne enquanto ef.paredeAtiva
    furiaCast:false,   // marca se Kronk lançou fúria neste turno (não decrementa)
    over:false,
    travado:false,
    mira:false         // true enquanto o menu de Ataque Estratégico (braço/torso/perna) está aberto
  };
}

/* ---------------- HABILIDADES DE BRYNE ---------------- */
const CUSTO_ESTOCADA = 35;
const CUSTO_LAMINA = 50;
const CUSTO_PAREDE_ATIVAR = 40;
const CUSTO_PAREDE_MANTER = 30;
const CUSTO_ESTRATEGICO_TORSO = 28;
const CUSTO_ESTRATEGICO_BRACO = 20;
const CUSTO_ESTRATEGICO_PERNA = 20;
const CUSTO_RESPIRO = 6;
const CUSTO_TERRENO = 15;
const CUSTO_LEITURA = 15;
const GANHO_ESTAMINA_TURNO = 20;

const habBryne = [
  {id:'estocada', nome:'Estocada', custoEstamina:CUSTO_ESTOCADA, tip:`<b>Ataque básico</b><br>D20+3 vs DIF 11. Dano 4–7.<br><b class="tip-ruim">100% de chance</b> de causar sangramento (1d4/turno por 3 turnos).<br>Acertar concede <b class="tip-foco">+25 Foco</b>.<br>Custa <b class="tip-estamina">${CUSTO_ESTOCADA} de Estamina</b>.`, tipo:'normal'},
  {id:'estrategico', nome:'Ataque Estratégico', custoEstamina:CUSTO_ESTRATEGICO_BRACO, tip:`<b>Precisão tática</b><br>Escolha braço, torso ou perna. Torso causa mais dano; braço e perna são mais fracos mas aplicam um efeito tático no Kronk por 2 turnos.<br>Custa <b class="tip-estamina">${CUSTO_ESTRATEGICO_TORSO} de Estamina</b> (torso) ou <b class="tip-estamina">${CUSTO_ESTRATEGICO_BRACO}</b> (braço/perna).`, tipo:'normal'},
  {id:'terreno', nome:'Usar o Terreno', custoEstamina:CUSTO_TERRENO, tip:`<b>Defensiva</b><br>Gasta o turno. O próximo ataque inimigo rola com desvantagem; se ele errar, Bryne contra-ataca causando 5 de dano.<br>Custa <b class="tip-estamina">${CUSTO_TERRENO} de Estamina</b>.`, tipo:'normal'},
  {id:'leitura', nome:'Leitura de Combate', custoEstamina:CUSTO_LEITURA, tip:`<b>Preparação</b><br>Gasta o turno. Seu próximo ataque rola com vantagem (2 dados, melhor resultado).<br>Custa <b class="tip-estamina">${CUSTO_LEITURA} de Estamina</b>.`, tipo:'normal'},
  {id:'parede', nome:'Parede de Escudos', custoEstamina:0, tip:`<b>Postura defensiva</b><br>Ergue um escudo com ${ESCUDO_MAX} de resistência própria. Enquanto ativa, o dano vai pro escudo primeiro — mas se o golpe for maior que a vida restante dele, o <b class="tip-ruim">excedente passa direto pra Bryne</b>. Atacar ou usar qualquer outra habilidade abandona a postura. Se o escudo quebrar, Bryne fica atordoada.<br>Custa <b class="tip-estamina">${CUSTO_PAREDE_ATIVAR} de Estamina</b> pra erguer e <b class="tip-estamina">${CUSTO_PAREDE_MANTER}/turno</b> pra manter — não dá pra segurar pra sempre.`, tipo:'normal'},
  {id:'lamina', nome:'A Lâmina', custoEstamina:CUSTO_LAMINA, tip:`<b>O golpe definitivo</b><br><b class="tip-acerto">Sempre acerta, sempre crítico</b> — dano dobrado garantido.<br>Requer <b class="tip-foco">Foco cheio</b> — consome todo o Foco ao usar.<br>Custa <b class="tip-estamina">${CUSTO_LAMINA} de Estamina</b>.`, tipo:'especial'}
];

/* Ataque Estratégico: sub-menu de mira (braço/torso/perna). Não consome o
   turno até uma opção real ser escolhida. Cada variante tem seu próprio
   custo de Estamina (torso é a opção de mais dano, custa mais). */
const miraBryne = [
  {id:'estrategico_braco', nome:'Braço', custoEstamina:CUSTO_ESTRATEGICO_BRACO, tip:`<b>Dano 3–5</b><br>Se acertar, Kronk causa <b>-2 de dano</b> por 2 turnos ("Braço Ferido").<br>Custa <b class="tip-estamina">${CUSTO_ESTRATEGICO_BRACO} de Estamina</b>.`},
  {id:'estrategico_torso', nome:'Torso', custoEstamina:CUSTO_ESTRATEGICO_TORSO, tip:`<b>Dano 5–8</b><br>A opção mais segura — maior dano, sem efeito adicional.<br>Custa <b class="tip-estamina">${CUSTO_ESTRATEGICO_TORSO} de Estamina</b>.`},
  {id:'estrategico_perna', nome:'Perna', custoEstamina:CUSTO_ESTRATEGICO_PERNA, tip:`<b>Dano 3–5</b><br>Se acertar, Kronk fica <b>impreciso</b> (-3 pra acertar) por 2 turnos ("Perna Ferida").<br>Custa <b class="tip-estamina">${CUSTO_ESTRATEGICO_PERNA} de Estamina</b>.`},
  {id:'estrategico_respiro', nome:'Respiro', custoEstamina:CUSTO_RESPIRO, tip:`<b>Golpe de fôlego</b><br>Dano baixo (1d4) — o objetivo não é machucar, é recuperar o ritmo.<br>Custa só <b class="tip-estamina">${CUSTO_RESPIRO} de Estamina</b>, bem menos que a regeneração do turno (+20) — a opção certa pra recuperar Estamina de verdade.`},
];
function abrirMira(){
  if(S.over||S.travado) return;
  S.mira = true;
  renderHabs();
}
function fecharMira(){
  S.mira = false;
  renderHabs();
}

/* =====================================================================
   FLUXO DE TURNO
   ===================================================================== */
function iniciarFasJogador(){
  if(S.over) return;
  S.bryne.estamina = clamp(S.bryne.estamina+20,0,S.bryne.estaminaMax);
  updateHP();
  if(S.ef.atordoa){
    S.ef.atordoa=false;
    setTurno('Bryne está presa — perde o turno.');
    log('Bryne não consegue agir. <span class="ruim">Turno perdido.</span>');
    renderEstados();
    S.travado=true; renderHabs();
    setTimeout(faseKronk, 1100);
    return;
  }
  S.travado=false;
  setTurno('Sua vez — escolha uma ação.');
  renderHabs();
}

function jogadorAge(id){
  if(S.over||S.travado) return;
  S.travado=true; renderHabs();
  setTurno('...');
  const ef = S.ef;
  const emDefesaAntes = !!(ef.terreno||ef.leitura||ef.paredeAtiva);
  const ehAtaque = (id==='estocada'||id==='lamina'||id==='estrategico_torso'||id==='estrategico_braco'||id==='estrategico_perna');
  let esperaKronk;
  if(id==='lamina'){
    esperaKronk = CUTSCENE_DURATION + 4000 + 300; // cutscene + pose-ataqueultimate + folga
  } else if(ehAtaque){
    esperaKronk = (emDefesaAntes ? 8000 : 4000) + 300; // bate com a duração real escolhida em poseAtaque('bryne')
  } else {
    // terreno / leitura / parede: só a transição pra postura defensiva (~1700ms), não uma animação longa
    esperaKronk = 2200;
  }
  const extra = (id==='lamina') ? CUTSCENE_DURATION : 0;
  resolverBryne(id);
  // o resultado pode vir com atraso (DELAY_IMPACTO, + cutscene se for ultimate); verifica fim depois disso
  setTimeout(()=>{ if(verificarFim()) return; }, DELAY_IMPACTO+150+extra);
  setTimeout(()=>{ if(!S.over) faseKronk(); }, esperaKronk);
}

function faseKronk(){
  if(S.over) return;
  setTurno('Kronk age...');
  // v60: Peso expira sozinho -- decrementado no INÍCIO do turno (antes de agir),
  // então o turno em que é ativado não conta, e Bryne tem exatamente até 3
  // turnos dela com o efeito valendo antes de sumir sozinho.
  if(S.ef.peso>0){
    S.ef.peso--;
    if(S.ef.peso===0) log('Kronk relaxa a postura de peso — a brecha se fecha.');
  }
  // Sangramento drena Kronk antes de ele agir
  if(S.ef.sangra>0){
    const d=Math.floor(Math.random()*4)+1; // 1d4
    aplicarDanoKronk(d);
    S.ef.sangra--;
    poseDano('kronk');
    dispararSangueKronk();
    vozKronkLevouDano();
    log(`Kronk sangra — <span class="ruim">${d}</span> de dano. (${S.ef.sangra} turno${S.ef.sangra===1?'':'s'} restante${S.ef.sangra===1?'':'s'})`);
    floats('kronk',d,'dano');
    renderEstados();
    if(verificarFim()) return;
  }
  const escolha = escolherKronk();
  if(escolha==='furia'){
    tocarCutsceneUltimate('kronk','Fúria', ()=>{
      const conectou = resolverKronk('furia');
      finalizarTurnoKronk(conectou, 3333); // v50: 80 frames/24fps do entrarage recortado
    });
    return;
  }
  const emRageAntes = S.ef.furia>0;
  const conectou = resolverKronk(escolha);
  finalizarTurnoKronk(conectou, duracaoAtaqueKronk(escolha, emRageAntes));
}

function finalizarTurnoKronk(conectou, duracaoAnimacao){
  // Raiva: decai quando Kronk não consegue pressionar Bryne (errou ou usou algo que não é ataque)
  if(!conectou){
    S.kronk.raiva = clamp(S.kronk.raiva-10,0,S.kronk.raivaMax);
  }
  // decrementos de duração (Kronk)
  if(S.ef.furia>0 && !S.furiaCast) S.ef.furia--;
  S.furiaCast=false;
  if(S.ef.macaCD>0) S.ef.macaCD--;
  if(S.ef.bracoFerido>0) S.ef.bracoFerido--;
  if(S.ef.pernaFerida>0) S.ef.pernaFerida--;
  renderEstados();
  updateHP();
  // v49: espera dinâmica -- antes era sempre DELAY_IMPACTO_KRONK+1800=4600ms fixo,
  // mesmo quando a animação real era bem mais curta (ou, no caso do Avalanche,
  // bem mais longa: 10s!). Agora espera o tempo real da pose escolhida, com uma
  // folga pequena, tornando o ritmo do jogo bem mais dinâmico.
  const espera = Math.max(DELAY_IMPACTO_KRONK+150, duracaoAnimacao+200);
  setTimeout(()=>{ if(verificarFim()) return; }, DELAY_IMPACTO_KRONK+150);
  setTimeout(()=>{ if(!S.over) iniciarFasJogador(); }, espera);
}

/* =====================================================================
   RESOLUÇÃO — BRYNE
   ===================================================================== */
function defKronkAtual(){ return S.ef.furia>0 ? 9 : S.kronk.defBase; }

function resolverBryne(id, cutscenePlayed){
  if(id==='lamina' && !cutscenePlayed){
    tocarCutsceneUltimate('bryne','A Lâmina', ()=>resolverBryne(id, true));
    return;
  }
  const ef=S.ef;

  // Escolher qualquer coisa != 'parede' abandona a postura de escudo imediatamente
  if(ef.paredeAtiva && id!=='parede'){
    ef.paredeAtiva=false; S.escudoHP=0;
    log('Bryne abandona a postura de escudo pra agir.');
  }

  const ataques = {
    estocada:          { nome:'ataca',           especial:false, dano:()=>clamp(Math.round(d20()/4)+2,4,7), dif:()=>defKronkAtual(),   parte:null, custoEstamina:CUSTO_ESTOCADA },
    lamina:            { nome:'desfere A Lâmina',especial:true,  dano:()=>Math.round(d20()/3)+3,             dif:()=>9,                 parte:null, custoEstamina:CUSTO_LAMINA },
    estrategico_torso: { nome:'mira o torso',    especial:false, dano:()=>clamp(Math.round(d20()/4)+3,5,8), dif:()=>defKronkAtual(),   parte:null, custoEstamina:CUSTO_ESTRATEGICO_TORSO },
    estrategico_braco: { nome:'mira o braço',    especial:false, dano:()=>clamp(Math.round(d20()/4)+1,3,5), dif:()=>defKronkAtual()+1, parte:'braco', custoEstamina:CUSTO_ESTRATEGICO_BRACO },
    estrategico_perna: { nome:'mira a perna',    especial:false, dano:()=>clamp(Math.round(d20()/4)+1,3,5), dif:()=>defKronkAtual()+1, parte:'perna', custoEstamina:CUSTO_ESTRATEGICO_PERNA },
    estrategico_respiro:{ nome:'desfere um golpe de respiro', especial:false, dano:()=>Math.floor(Math.random()*4)+1 /*1d4*/, dif:()=>defKronkAtual()-1, parte:null, custoEstamina:CUSTO_RESPIRO },
  };

  if(ataques[id]){
    const cfg = ataques[id];
    if(id==='lamina'){
      poseTemporariaCustom('bryne','ataqueultimate', 4000, ()=>'base'); // 96 frames/24fps
    } else if(id==='estrategico_respiro'){
      poseTemporariaCustom('bryne','respiro', 4000, ()=>'base'); // 96 frames/24fps
    } else {
      poseAtaque('bryne');
    }
    poeiraImpactoBryne(id==='lamina'?0.85:0.55);
    anim('bryne','atacando');
    if(id==='lamina') S.bryne.foco = 0; // custo consumido ao usar (acerte ou erre)
    if(cfg.custoEstamina>0){
      S.bryne.estamina = clamp(S.bryne.estamina-cfg.custoEstamina,0,S.bryne.estaminaMax);
      updateHP();
    }

    let r1=d20(), r2=d20(), rol;
    if(ef.leitura){ rol=Math.max(r1,r2); ef.leitura=false; }
    else { rol=r1; }
    const total = rol + S.bryne.atk;
    const crit = (rol===20) || id==='lamina'; // v60: A Lâmina agora é sempre crítico e sempre acerta (usuário pediu mais força pro golpe especial)
    const alvoDIF = cfg.dif();

    if(crit || total>=alvoDIF){
      let dano = cfg.dano();
      if(crit) dano*=2;
      setTimeout(()=>{
        aplicarDanoKronk(dano);
        if(id!=='lamina') S.bryne.foco = clamp(S.bryne.foco+25,0,S.bryne.focoMax);
        poseDano('kronk');
        dispararSangueKronk();
        impacto('kronk','corte');
        if(cfg.parte==='braco'){ ef.bracoFerido=2; log('O golpe atinge o braço — Kronk causa <span class="acerto">menos dano</span> por 2 turnos.'); }
        if(cfg.parte==='perna'){ ef.pernaFerida=2; log('O golpe atinge a perna — Kronk fica <span class="acerto">impreciso</span> por 2 turnos.'); }
        if(crit){
          som('critico'); somBryneHit(); vozBryneAtacou(); vozKronkLevouDano();
          log(`<span class="acerto">CRÍTICO!</span> Bryne ${cfg.nome} — dano dobrado: <span class="ruim">${dano}</span>.`,'crit');
          floats('kronk',dano,'crit');
        } else {
          som('ataque'); somBryneHit(); vozBryneAtacou(); vozKronkLevouDano();
          log(`Bryne ${cfg.nome} — D20: <span class="dado">${rol}</span> → <span class="acerto">acertou</span>. Dano: ${dano}.`);
          floats('kronk',dano,'dano');
        }
        if(id==='estocada'){
          S.ef.sangra = 3;
          log('A lâmina abre um corte — Kronk <span class="ruim">sangra</span> por 3 turnos.');
        }
        renderEstados(); updateHP();
      }, DELAY_IMPACTO);
    } else {
      setTimeout(()=>{
        som('erro'); somBryneMiss(); vozKronkRiu();
        log(`Bryne ${cfg.nome} — D20: <span class="dado">${rol}</span> → <span class="ruim">errou</span>.`);
        floats('kronk','errou','erro');
        if(ef.peso){
          ef.peso=0;
          som('ataque'); somKronkHit(); vozBryneLevouDano();
          poseAtaque('kronk');
          poeiraImpactoKronk();
          log('Kronk usa o peso — <span class="ruim">contra-ataque: 6</span>.');
          aplicarDanoBryne(6,true);
          poseDano('bryne');
          dispararSangueBryne();
          floats('bryne',6,'dano');
          anim('bryne','golpeado'); abalar();
        }
        renderEstados(); updateHP();
      }, DELAY_IMPACTO);
    }
  }
  else if(id==='terreno'){
    ef.terreno=true;
    S.bryne.estamina = clamp(S.bryne.estamina-CUSTO_TERRENO,0,S.bryne.estaminaMax);
    poseDefesa('bryne');
    som('buff');
    log('Bryne lê o terreno e se posiciona. Inimigo atacará em <span class="acerto">desvantagem</span>.');
    setTurno('Terreno tomado.');
    updateHP();
  }
  else if(id==='leitura'){
    ef.leitura=true;
    S.bryne.estamina = clamp(S.bryne.estamina-CUSTO_LEITURA,0,S.bryne.estaminaMax);
    poseDefesa('bryne');
    som('buff');
    log('Bryne estuda os movimentos. Próximo ataque com <span class="acerto">vantagem</span>.');
    updateHP();
  }
  else if(id==='parede'){
    if(!ef.paredeAtiva){
      ef.paredeAtiva=true;
      S.escudoHP=ESCUDO_MAX;
      S.bryne.estamina = clamp(S.bryne.estamina-CUSTO_PAREDE_ATIVAR,0,S.bryne.estaminaMax);
      poseDefesa('bryne');
      som('buff');
      log(`Bryne ergue o escudo (<span class="acerto">${ESCUDO_MAX}</span> de resistência) e assume a postura defensiva.`);
    } else {
      S.bryne.estamina = clamp(S.bryne.estamina-CUSTO_PAREDE_MANTER,0,S.bryne.estaminaMax);
      poseDefesa('bryne');
      log('Bryne mantém a posição atrás do escudo.');
    }
    updateHP();
  }
  renderEstados();
}

/* =====================================================================
   RESOLUÇÃO — KRONK (IA)
   ===================================================================== */
function escolherKronk(){
  const ef=S.ef;
  const hpFrac = S.kronk.hp/S.kronk.max;
  const macaPronta = ef.macaCD===0;
  const furiaPronta = S.kronk.raiva>=S.kronk.raivaMax;
  const bryneBaixa = S.bryne.hp < 20;

  // Em fúria: golpe mais forte do jogo, prioridade alta enquanto disponível
  if(ef.furia>0 && !ef.avalancheUsada && Math.random()<0.7) return 'avalanche';

  // Modo desesperado
  if(hpFrac<=0.30){
    if(furiaPronta && ef.furia<=0 && S.kronk.hp<S.kronk.max) return 'furia';
    if(macaPronta) return 'maca';
    return 'macada';
  }
  // Acabar com Bryne se ela estiver baixa
  if(bryneBaixa && macaPronta) return 'maca';
  if(bryneBaixa) return ef.preso?'macada':'garrar'; // prender e fechar

  // Modo normal — pesos
  const r=Math.random();
  if(furiaPronta && ef.furia<=0 && r<0.35) return 'furia';
  if(r<0.55) return 'macada';
  if(r<0.75) return 'garrar';
  if(r<0.90) return 'peso';
  return macaPronta ? 'maca' : 'macada';
}

function resolverKronk(id){
  const ef=S.ef;

  if(id==='furia'){
    S.kronk.hp = clamp(S.kronk.hp+10,0,S.kronk.max);
    ef.furia=3; ef.avalancheUsada=false; S.furiaCast=true; S.kronk.raiva=0;
    // transição pra fúria: toca a animação de transformação uma vez e
    // assenta na pose de rage-idle (em vez de cortar direto pro rage-idle)
    S.kronk._emRage = true;
    poseTemporariaCustom('kronk','entrarage', 3333, ()=>'defesa'); // v50: 80 frames/24fps (era 6250/150 -- vídeo recortado pra tirar o corte de cabeça sustentado nos últimos frames, ver RESUMO v50)
    som('cura');
    tocar('kronkragescream1.mp3', VOL_VOZ);
    log('Kronk explode em <span class="ruim">FÚRIA</span>. <span class="acerto">+10 vida</span>, mais força — mas fica exposto.');
    floats('kronk',10,'cura');
    updateHP();
    renderEstados();
    return false; // não pressionou Bryne neste turno -> Raiva não é reabastecida
  }
  if(id==='peso'){
    ef.peso=3; // v60: era permanente (só acabava se Bryne errasse) -- agora expira sozinho em 3 turnos
    poseAtaque('kronk','peso'); // mesma animação de pressão do Garrar
    poeiraImpactoKronk();
    som('buff');
    log('Kronk avança como pedra. Por até 3 turnos, se Bryne atacar e <span class="ruim">errar</span>, paga caro.');
    renderEstados();
    return false;
  }

  // ataques: macada, garrar, maca, avalanche
  poseAtaque('kronk', id);
  poeiraImpactoKronk();
  anim('kronk','atacando');
  const bonusFuria = ef.furia>0 ? 2 : 0;
  let nome, alvoDIF;
  if(id==='macada'){ nome='ergue a maça'; alvoDIF=14; }
  else if(id==='garrar'){ nome='agarra'; alvoDIF=12; }
  else if(id==='avalanche'){ nome='desfere AVALANCHE'; alvoDIF=15; ef.avalancheUsada=true; }
  else { nome='Maça para Cima'; alvoDIF=14; ef.macaCD=2; }
  // Perna Ferida (Ataque Estratégico de Bryne): Kronk perde precisão
  if(ef.pernaFerida>0) alvoDIF += 3;

  let acertou,rol,crit=false;
  if(ef.preso && id!=='garrar'){
    // preso: acerta automático (não vale para o próprio garrar que aplicaria de novo)
    acertou=true; rol='—'; ef.preso=false;
    log('Bryne está presa — o golpe acerta sem esquiva.');
  } else {
    // desvantagem do Terreno
    let a=d20(), b=d20();
    rol = ef.terreno ? Math.min(a,b) : a;
    crit = (rol===20);
    const total = rol + S.kronk.atk;
    acertou = crit || total>=alvoDIF;
  }

  setTimeout(()=>{
    if(acertou){
      let dano;
      if(id==='macada'){ dano=clamp(Math.round(d20()/4)+3,5,8); }
      else if(id==='garrar'){ const x=d20(); dano = x<=7?3 : x<=14?4 : 5; ef.preso=true; }
      else if(id==='avalanche'){ dano = crit ? 19 : clamp(Math.round(d20()/3)+11,15,19); }
      else { dano = crit ? 11 : clamp(Math.round(d20()/3)+5,8,11); }
      dano += bonusFuria;
      if(crit && id!=='garrar' && id!=='avalanche') dano = (id==='maca') ? dano : dano*2;
      else if(crit && id==='avalanche') dano = Math.round(dano*1.5); // já é o golpe mais forte; dobrar seria demais
      // Braço Ferido (Ataque Estratégico de Bryne): Kronk causa menos dano
      if(ef.bracoFerido>0) dano = Math.max(1,dano-2);

      const foiParede = ef.paredeAtiva;
      const escudoAntesDoGolpe = S.escudoHP;
      aplicarDanoBryne(dano,false);
      const escudoQuebrouAgora = foiParede && !ef.paredeAtiva;
      if(!escudoQuebrouAgora) poseDano('bryne'); // escudo quebrando já tem a própria animação (ver aplicarDanoBryne)
      if(!foiParede){ dispararSangueBryne(); if(crit) dispararSangueCritico(); }
      impacto('bryne', foiParede?'escudo':'golpe');
      anim('bryne','golpeado'); abalar();

      if(foiParede){
        som('bloqueio');
        somKronkHit();
        vozKronkAcertou();
        log(`Kronk ${nome} — o golpe ecoa no <span class="acerto">escudo</span>. Dano: ${dano}.`);
        floats('bryne',dano,'escudo');
        if(escudoQuebrouAgora){
          const excedente = dano - escudoAntesDoGolpe;
          if(excedente>0){
            log(`<span class="ruim">O escudo se estilhaça!</span> O golpe era forte demais — <span class="ruim">${excedente}</span> de dano passa direto pra Bryne, que fica atordoada.`);
            floats('bryne',excedente,'dano');
          } else {
            log('<span class="ruim">O escudo se estilhaça!</span> Bryne fica atordoada.');
          }
        }
      } else if(crit){
        som('critico');
        somKronkHit();
        vozKronkAcertou();
        vozBryneLevouDano();
        log(`<span class="ruim">CRÍTICO!</span> Kronk ${nome} — dano: ${dano}.`,'crit');
        floats('bryne',dano,'crit');
        if(id==='maca'){ ef.atordoa=true; log('O baque atordoa Bryne — ela <span class="ruim">perde o próximo turno</span>.'); }
      } else {
        som('ataque');
        somKronkHit();
        vozKronkAcertou();
        vozBryneLevouDano();
        const rolTxt = rol==='—' ? '—' : `<span class="dado">${rol}</span>`;
        log(`Kronk ${nome} — D20: ${rolTxt} → <span class="ruim">acertou</span>. Dano: ${dano}.${id==='garrar'?' Bryne presa.':''}`);
        floats('bryne',dano,'dano');
      }
    } else {
      som('erro');
      somKronkMiss();
      log(`Kronk ${nome} — D20: <span class="dado">${rol}</span> → <span class="acerto">errou</span>.`);
      floats('bryne','errou','erro');
      if(ef.terreno){
        som('ataque');
        somBryneHit();
        vozBryneAtacou();
        vozKronkLevouDano();
        poseContraataque();
        poeiraImpactoBryne(0.7);
        log('Bryne aproveita a brecha — <span class="acerto">contra-ataque: 5</span>.');
        aplicarDanoKronk(5);
        S.bryne.foco = clamp(S.bryne.foco+25,0,S.bryne.focoMax);
        updateHP();
        poseDano('kronk');
        dispararSangueKronk();
        floats('kronk',5,'dano');
        anim('kronk','golpeado');
      } else {
        vozBryneEsquivou();
      }
      // Bryne não tem mais animação de esquiva — permanece na pose atual (base ou defesa)
    }
    ef.terreno=false;
    renderEstados();
    if(verificarFim()) return;
  }, DELAY_IMPACTO_KRONK);
  return acertou;
}

/* =====================================================================
   DANO / VIDA
   ===================================================================== */
function aplicarDanoKronk(d){
  S.kronk.hp = clamp(S.kronk.hp-d,0,S.kronk.max);
  S.kronk.raiva = clamp(S.kronk.raiva+18,0,S.kronk.raivaMax);
  updateHP();
}
function aplicarDanoBryne(d,ignoraParede){
  let dano=d;
  if(S.ef.paredeAtiva && !ignoraParede){
    const escudoAntes = S.escudoHP;
    if(dano >= escudoAntes){
      // v55: golpe maior que a vida restante do escudo -- ele quebra e o
      // EXCEDENTE (o que sobrou do golpe depois de gastar toda a vida do
      // escudo) vira dano de verdade em Bryne, em vez de sumir sem efeito
      const excedente = dano - escudoAntes;
      S.escudoHP = 0;
      S.ef.paredeAtiva = false;
      S.ef.atordoa = true;
      poseTemporariaCustom('bryne','escudoquebra', 5667, ()=>'base'); // 136 frames/24fps
      if(excedente>0){
        S.bryne.foco = clamp(S.bryne.foco-15,0,S.bryne.focoMax);
        S.bryne.hp = clamp(S.bryne.hp-excedente,0,S.bryne.max);
      }
    } else {
      S.escudoHP -= dano;
    }
    updateHP();
    return;
  }
  S.bryne.foco = clamp(S.bryne.foco-15,0,S.bryne.focoMax);
  S.bryne.hp = clamp(S.bryne.hp-dano,0,S.bryne.max);
  updateHP();
}

/* =====================================================================
   RENDER
   ===================================================================== */
function updateHP(){
  const bk=S.kronk.hp/S.kronk.max*100;
  const bb=S.bryne.hp/S.bryne.max*100;
  const barK=document.getElementById('bar-kronk');
  const barB=document.getElementById('bar-bryne');
  barK.style.width=bk+'%';
  barB.style.width=bb+'%';
  barK.style.background=corHP(bk);
  barB.style.background=corHP(bb);
  document.getElementById('num-kronk').textContent=`${S.kronk.hp} / ${S.kronk.max}`;
  document.getElementById('num-bryne').textContent=`${S.bryne.hp} / ${S.bryne.max}`;

  const barRaiva=document.getElementById('bar-raiva');
  const trilhoRaiva=document.getElementById('trilho-raiva');
  const raivaPct = S.kronk.raiva/S.kronk.raivaMax*100;
  barRaiva.style.width=raivaPct+'%';
  trilhoRaiva.classList.toggle('cheio', S.kronk.raiva>=S.kronk.raivaMax && S.ef.furia<=0);

  const barFoco=document.getElementById('bar-foco');
  const trilhoFoco=document.getElementById('trilho-foco');
  const focoPct = S.bryne.foco/S.bryne.focoMax*100;
  barFoco.style.width=focoPct+'%';
  trilhoFoco.classList.toggle('cheio', S.bryne.foco>=S.bryne.focoMax);

  const barEstamina=document.getElementById('bar-estamina');
  const estaminaPct = S.bryne.estamina/S.bryne.estaminaMax*100;
  barEstamina.style.width=estaminaPct+'%';
}
function corHP(p){
  if(p>50) return 'var(--verde-hp)';
  if(p>22) return 'var(--amarelo-hp)';
  return 'var(--vermelho-hp)';
}

   customizado) pra o jogador entender o que cada pílula significa sem
   precisar adivinhar (ex.: passar o mouse em "Sangramento" ou "Presa"). */

  'Presa':       'Bryne está presa pelo agarrão de Kronk: o próximo golpe dele acerta automaticamente, sem chance de esquiva.',
};

function renderEstados(){
  const ek=document.getElementById('est-kronk');
  const eb=document.getElementById('est-bryne');
  ek.innerHTML=''; eb.innerHTML='';
  const add=(cont,txt,cls,tituloTip)=>{
    const s=document.createElement('span');
    s.className='pilula '+(cls||'');
    s.innerHTML = `<span class="pilula-txt">${txt}</span><span class="pilula-tip">${descEstado[tituloTip||txt]||''}</span>`;
    cont.appendChild(s);
  };
  // Kronk
  if(S.ef.furia>0) add(ek,'Fúria '+S.ef.furia,'ruim','Fúria');
  if(S.ef.sangra>0) add(ek,'Sangra '+S.ef.sangra,'ruim','Sangra');
  if(S.ef.peso>0) add(ek,'Peso '+S.ef.peso,'frio','Peso');
  if(S.ef.macaCD>0) add(ek,'Maça '+S.ef.macaCD,'frio','Maça CD');
  if(S.ef.bracoFerido>0) add(ek,'Braço Ferido '+S.ef.bracoFerido,'bom','Braço Ferido');
  if(S.ef.pernaFerida>0) add(ek,'Perna Ferida '+S.ef.pernaFerida,'bom','Perna Ferida');
  // Bryne
  if(S.ef.terreno) add(eb,'Terreno','bom','Terreno');
  if(S.ef.leitura) add(eb,'Leitura','bom','Leitura');
  if(S.ef.paredeAtiva) add(eb,`Escudo ${S.escudoHP}/${ESCUDO_MAX}`,'bom','Escudo');
  if(S.ef.preso) add(eb,'Presa','ruim','Presa');
}

function renderHabs(){
  const cont=document.getElementById('habilidades');
  cont.innerHTML='';

  if(S.mira){
    miraBryne.forEach(h=>{
      const b=document.createElement('button');
      b.className='hab mira';
      const semEstamina = S.bryne.estamina < h.custoEstamina;
      b.disabled = S.travado || S.over || semEstamina;
      const selo = semEstamina ? '<span class="recarga">sem estamina</span>' : '';
      b.innerHTML=`${selo}<span class="h-nome">${h.nome}</span><span class="h-tip">${h.tip}</span>`;
      const acionar=()=>{ desbloquearAudio(); S.mira=false; jogadorAge(h.id); };
      if(EH_TOUCH){
        b.onclick=()=>{
          if(b.classList.contains('armado')){ limparArmados(); acionar(); }
          else { limparArmados(); b.classList.add('armado','mostrar-tip'); }
        };
      } else {
        b.onclick=acionar;
      }
      cont.appendChild(b);
    });
    const voltar=document.createElement('button');
    voltar.className='hab hab-voltar';
    voltar.innerHTML='<span class="h-nome">‹ Voltar</span>';
    voltar.onclick=fecharMira;
    cont.appendChild(voltar);
    return;
  }

  habBryne.forEach(h=>{
    const b=document.createElement('button');
    b.className='hab'+(h.tipo==='especial'?' especial':'')+(h.id==='parede'?' postura':'');
    let selo='';
    let disabled = S.travado || S.over;
    const semEstamina = h.custoEstamina>0 && S.bryne.estamina < h.custoEstamina;
    if(h.id==='lamina'){
      if(S.bryne.foco < S.bryne.focoMax){ disabled=true; selo=`<span class="recarga">foco ${S.bryne.foco}/${S.bryne.focoMax}</span>`; }
      else if(semEstamina){ disabled=true; selo='<span class="recarga">sem estamina</span>'; }
      else { selo='<span class="recarga pronto">pronta!</span>'; }
    } else if(h.id==='parede'){
      const custoParede = S.ef.paredeAtiva ? CUSTO_PAREDE_MANTER : CUSTO_PAREDE_ATIVAR;
      if(S.bryne.estamina < custoParede){ disabled=true; selo='<span class="recarga">sem estamina</span>'; }
    } else if(semEstamina){
      disabled=true; selo='<span class="recarga">sem estamina</span>';
    }
    let nomeExibido = h.nome;
    if(h.id==='parede' && S.ef.paredeAtiva) nomeExibido = 'Manter Posição';
    b.innerHTML=`${selo}<span class="h-nome">${h.id==='lamina'?'⚔ ':''}${nomeExibido}</span><span class="h-tip">${h.tip}</span>`;
    b.disabled=disabled;

    const acaoId = h.id==='estrategico' ? null : h.id;
    if(EH_TOUCH){
      // Mobile: 1º toque mostra tooltip e arma; 2º toque no mesmo botão executa
      b.onclick=()=>{
        if(b.classList.contains('armado')){
          limparArmados();
          desbloquearAudio();
          if(acaoId) jogadorAge(acaoId); else abrirMira();
        } else {
          limparArmados();
          b.classList.add('armado','mostrar-tip');
        }
      };
    } else {
      // Desktop: hover mostra tooltip, clique executa direto
      b.onclick=()=>{ desbloquearAudio(); if(acaoId) jogadorAge(acaoId); else abrirMira(); };
    }
    cont.appendChild(b);
  });
}
