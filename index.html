/* ---- Sistema de poses (base / ataque / defesa) ---- */
const timersPose = {kronk:null, bryne:null};
const videoEndListeners = {kronk:null, bryne:null};

function setPose(quem, pose){
  const el=document.getElementById(quem);
  el.querySelectorAll('img, canvas').forEach(m=>m.classList.remove('ativa'));
  const cv = el.querySelector('canvas.pose-'+pose);
  const fb = el.querySelector('.pose-'+pose+'-fallback');
  if(cv && cv.dataset.falhou!=='1' && cv._vid){
    cv.classList.add('ativa');
    // se a pose tem variações, sorteia uma a cada ativação
    if(cv.dataset.videoAlts){
      const alts = cv.dataset.videoAlts.split(',');
      const escolha = alts[Math.floor(Math.random()*alts.length)];
      if(cv._vid.dataset.atual !== escolha){
        cv._vid.src = escolha;
        cv._vid.dataset.atual = escolha;
      }
    }
    try{ cv._vid.currentTime=0; cv._vid.play().catch(()=>{}); }catch(e){}
    return;
  }
  if(fb){ fb.classList.add('ativa'); return; }
  const alvo = el.querySelector('.pose-'+pose);
  if(alvo) alvo.classList.add('ativa');
}

// retorna a pose "de repouso" do personagem (defesa se algum buff ativo, senão base)
// kronk: só a fúria muda a pose de repouso (pra rage-idle); "peso" é só uma
// postura de ataque temporária (pose-pressao), não muda o idle
function poseRepouso(quem){
  const emDefesa = (quem==='bryne' && (S.ef.terreno||S.ef.leitura||S.ef.paredeAtiva))
                || (quem==='kronk' && S.ef.furia>0);
  return emDefesa ? 'defesa' : 'base';
}

// pose de retorno do Kronk após ataque/dano: se ele SAIU da fúria durante a
// ação atual (furia decrementou a 0 no meio do turno), toca a transição
// "ragetonormal" antes de assentar no idle normal, em vez de cortar direto
// pra base. Retorna null pra sinalizar que a troca de pose já foi disparada
// por conta própria (finalizar() não deve chamar setPose de novo por cima).
function retornoKronk(){
  if(S.kronk._emRage && S.ef.furia<=0){
    S.kronk._emRage = false;
    poseTemporariaCustom('kronk','ragetonormal', 3333, ()=>'base'); // v50: 80 frames/24fps (era 6250/150 -- vídeo recortado, ver RESUMO v50)
    return null;
  }
  if(S.ef.furia>0) S.kronk._emRage = true;
  return poseRepouso('kronk');
}

// limpa qualquer temporizador/listener pendente de uma troca de pose anterior
function limparTrocaPendente(quem){
  if(timersPose[quem]){ clearTimeout(timersPose[quem]); timersPose[quem]=null; }
  if(videoEndListeners[quem]){
    videoEndListeners[quem].vid.removeEventListener('ended', videoEndListeners[quem].fn);
    if(videoEndListeners[quem].intervalId) clearInterval(videoEndListeners[quem].intervalId);
    videoEndListeners[quem]=null;
  }
}

// pose temporária que ao final chama computeReturnPose() (avaliado no momento da troca, não do disparo)
// usa o evento real 'ended' do vídeo quando disponível (sincroniza com o vídeo de verdade,
// não com um tempo chutado) — com um timer de segurança generoso caso 'ended' não dispare.
function poseTemporariaCustom(quem, pose, dur, computeReturnPose){
  limparTrocaPendente(quem);
  setPose(quem, pose);
  const el = document.getElementById(quem);
  const cv = el.querySelector('canvas.pose-'+pose);

  const finalizar = () => {
    limparTrocaPendente(quem);
    // se computeReturnPose() já disparou a própria troca de pose (ex.: uma
    // transição), ele retorna null/false e não sobrescrevemos por cima
    const proxima = computeReturnPose();
    if(proxima) setPose(quem, proxima);
  };

  if(cv && cv._vid && cv.dataset.falhou!=='1'){
    const vid = cv._vid;
    let jaFinalizou = false;
    const finalizarUmaVez = () => { if(!jaFinalizou){ jaFinalizou=true; finalizar(); } };
    const onEnded = () => finalizarUmaVez();
    vid.addEventListener('ended', onEnded, {once:true});
    // sondagem: em alguns navegadores/codecs 'ended' não dispara mesmo com
    // currentTime já igual à duração — então verificamos isso também, com
    // margem mínima (bem menor que 1 frame a 24fps = 0.0417s) para não
    // cortar os últimos quadros do vídeo (ex.: retorno natural à idle)
    const intervalId = setInterval(()=>{
      if(vid.ended || (vid.duration && vid.currentTime >= vid.duration - 0.02)){
        clearInterval(intervalId);
        finalizarUmaVez();
      }
    }, 30);
    videoEndListeners[quem] = {vid, fn:onEnded, intervalId};
    // rede de segurança generosa (1.6x a duração esperada) caso nada acima dispare
    timersPose[quem] = setTimeout(finalizarUmaVez, (dur||2200)*1.6);
  } else {
    timersPose[quem] = setTimeout(finalizar, dur||2200);
  }
}
function poseTemporaria(quem, pose, dur){
  poseTemporariaCustom(quem, pose, dur, ()=>poseRepouso(quem));
}

// tipoOuId: usado só pelo Kronk, pra escolher a animação certa —
// 'garrar'/'peso' usam a pose de pressão (mesma animação pros dois);
// qualquer outra coisa usa a animação de ataque genérica. Em fúria, TODO
// ataque (incluindo garrar/peso) usa a animação única de ataque em fúria.
function duracaoAtaqueKronk(tipoOuId, emRage){
  const usaPressao = (tipoOuId==='garrar' || tipoOuId==='peso');
  if(tipoOuId==='avalanche') return 10000;
  if(emRage && usaPressao) return 4000;
  if(emRage) return 4000;
  if(usaPressao) return 4542;
  return 5833;
}
function poseAtaque(quem, tipoOuId){
  if(quem==='kronk'){
    const emRage = S.ef.furia>0;
    S.kronk._emRage = emRage;
    const usaPressao = (tipoOuId==='garrar' || tipoOuId==='peso');
    let pose;
    const dur = duracaoAtaqueKronk(tipoOuId, emRage);
    if(tipoOuId==='avalanche'){ pose='avalanche'; }  // v40: 240 frames/24fps, pose dedicada (kronkultimate.mp4)
    else if(emRage && usaPressao){ pose='ragepressao'; }  // 96 frames/24fps -- v24: pose nova, antes reusava rageataque
    else if(emRage){ pose='rageataque'; }        // 96 frames/24fps
    else if(usaPressao){ pose='pressao'; }       // 109 frames/24fps
    else { pose='ataque'; }                      // v26: 140 frames/24fps (era 5708/137, valor desatualizado desde a troca de vídeo no v23 -- não causava bug visível pq o vídeo real manda via 'ended'/polling, mas estava incorreto)
    poseTemporariaCustom('kronk', pose, dur, retornoKronk);
    return;
  }
  // Bryne: ataque muda conforme ela já estar ou não em postura defensiva
  // durações batem com o vídeo completo (96 frames=4000ms idle / 192 frames=8000ms da defesa, vídeo v2 já retorna sozinha ao idle no final)
  const emDefesa = !!(S.ef.terreno||S.ef.leitura||S.ef.paredeAtiva);
  const pose = emDefesa ? 'ataquedadefesa' : 'ataque';
  poseTemporariaCustom('bryne', pose, emDefesa?8000:4000, ()=>'base'); // atacar sempre sai da guarda
}

// Bryne contra-ataca (gatilho específico de Usar o Terreno quando o inimigo erra)
function poseContraataque(){
  poseTemporariaCustom('bryne','contraataque', 6834, ()=>'base'); // vídeo completo (v3): 164 frames a 24fps=6834ms
}

function poseDano(quem){
  if(quem==='bryne'){
    const emDefesa = !!(S.ef.terreno||S.ef.leitura||S.ef.paredeAtiva);
    const pose = emDefesa ? 'danodefesa' : 'dano';
    // v39: duração real conferida via ffprobe -- dano idle=96 frames/24fps=4000ms;
    // danodefesa=100 frames/25fps=4000ms (era 7000ms no código, nunca bateu com o
    // arquivo real -- o 'ended' do vídeo sempre mandou de verdade, então não
    // travava por causa disso, mas o timer de segurança ficava desnecessariamente
    // longo caso 'ended' falhasse)
    poseTemporariaCustom('bryne', pose, 4000, ()=>poseRepouso('bryne'));
    return;
  }
  const emRage = S.ef.furia>0;
  S.kronk._emRage = emRage;
  const pose = emRage ? 'ragedano' : 'dano';
  poseTemporariaCustom('kronk', pose, 4000, retornoKronk); // ambos 96 frames/24fps=4000ms
}

function poseDefesa(quem){
  if(quem==='bryne'){
    const el=document.getElementById('bryne');
    const jaEmDefesa = el.querySelector('.pose-defesa.ativa') || el.querySelector('.pose-entradadefesa.ativa');
    if(jaEmDefesa) return; // já entrando/em guarda — não repete a transição
    limparTrocaPendente('bryne');
    setPose('bryne','entradadefesa');
    timersPose.bryne = setTimeout(()=>{
      limparTrocaPendente('bryne');
      setPose('bryne','defesa');
    }, 1700);
    return;
  }
  limparTrocaPendente(quem);
  setPose(quem,'defesa');
}

function poseBase(quem){
  limparTrocaPendente(quem);
  setPose(quem,'base');
}

/* =====================================================================
   FIM DE JOGO
   ===================================================================== */
function verificarFim(){
  if(S.kronk.hp<=0){
    // v45: agora as duas variantes de morte do Kronk (normal e fúria) têm
    // animação própria -- trava o jogo na hora, só mostra a tela de fim
    // depois dos 4s de queda
    S.over=true; S.travado=true; renderHabs();
    if(S.ef.furia>0){
      poseTemporariaCustom('kronk','ragemorre', 4000, ()=>{ fimDeJogo(true); return null; });
    } else {
      poseTemporariaCustom('kronk','morre', 4000, ()=>{ fimDeJogo(true); return null; });
    }
    return true;
  }
  if(S.bryne.hp<=0){
    // v44: morte da Bryne também tem animação própria
    S.over=true; S.travado=true; renderHabs();
    poseTemporariaCustom('bryne','morre', 4000, ()=>{ fimDeJogo(false); return null; });
    return true;
  }
  return false;
}
const PONTOS_MAX = 1000; // v56: escala de pontuação -- pensada pra se encaixar no
                          // sistema maior do universo (cada minigame gera pontos
                          // numa escala parecida, pra dar pra comparar/somar depois)

function calcularPontuacaoFinal(){
  // HP restante da Bryne convertido pra pontuação. Se ela perder, hp=0,
  // pontuação=0 naturalmente -- não precisa de caso especial.
  return Math.round((S.bryne.hp/S.bryne.max) * PONTOS_MAX);
}

function animarContagemPontuacao(alvo, duracaoMs){
  const el = document.getElementById('pontuacao-numero');
  const inicio = performance.now();
  function passo(agora){
    const t = Math.min(1,(agora-inicio)/duracaoMs);
    const easeOut = 1-Math.pow(1-t,3); // desacelera suave no final, não linear
    el.textContent = Math.round(alvo*easeOut);
    if(t<1) requestAnimationFrame(passo);
    else el.textContent = alvo;
  }
  requestAnimationFrame(passo);
}

function fimDeJogo(venceu){
  S.over=true; S.travado=true;
  renderHabs();
  const fim=document.getElementById('fim');
  fim.className='fim '+(venceu?'vitoria':'derrota');
  fim.style.display='flex';

  const pontuacao = calcularPontuacaoFinal();
  document.getElementById('pontuacao-numero').textContent='0';
  document.getElementById('pontuacao-detalhe').textContent = `${S.bryne.hp} / ${S.bryne.max} de vida restante`;
  setTimeout(()=>animarContagemPontuacao(pontuacao, 1100), 550); // espera o bloco entrar (v. CSS) antes de contar

  if(venceu){
    som('vitoria');
    document.getElementById('fim-titulo').textContent='Bryne vence';
    document.getElementById('fim-texto').textContent='A Lâmina permanece de pé. A Boca Seca guarda seus mortos.';
    setTurno('Fim do duelo.');
  } else {
    som('derrota');
    document.getElementById('fim-titulo').textContent='Kronk vence';
    document.getElementById('fim-texto').textContent='Kronk ficar de pé. Kronk ser o mais forte.';
    setTurno('Fim do duelo.');
  }
}

/* =====================================================================
   ÁUDIO — Web Audio API (sintético) + BGM arquivo
   ===================================================================== */
let audioCtx=null, mutado=false, audioLiberado=false;

function getCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function som(tipo){
  if(mutado) return;
  try{
    const ctx=getCtx();
    const t=ctx.currentTime;
    const g=ctx.createGain();
    g.connect(ctx.destination);

    if(tipo==='ataque'){
      // impacto seco — ruído + tonal
      const buf=ctx.createBuffer(1,ctx.sampleRate*0.18,ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.5);
      const src=ctx.createBufferSource(); src.buffer=buf;
      const filt=ctx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=180; filt.Q.value=0.8;
      src.connect(filt); filt.connect(g);
      g.gain.setValueAtTime(0.6,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
      src.start(t);
      // tonal punch
      const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.setValueAtTime(80,t); osc.frequency.exponentialRampToValueAtTime(30,t+0.12);
      const g2=ctx.createGain(); g2.gain.setValueAtTime(0.4,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.14);
      osc.connect(g2); g2.connect(ctx.destination); osc.start(t); osc.stop(t+0.14);
    }
    else if(tipo==='critico'){
      // impacto pesado em duas camadas
      const buf=ctx.createBuffer(1,ctx.sampleRate*0.28,ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.8);
      const src=ctx.createBufferSource(); src.buffer=buf;
      const filt=ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=300;
      src.connect(filt); filt.connect(g);
      g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
      src.start(t);
      // sub-bass
      const osc=ctx.createOscillator(); osc.type='triangle'; osc.frequency.setValueAtTime(55,t); osc.frequency.exponentialRampToValueAtTime(20,t+0.22);
      const g2=ctx.createGain(); g2.gain.setValueAtTime(0.7,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.22);
      osc.connect(g2); g2.connect(ctx.destination); osc.start(t); osc.stop(t+0.22);
      // crack agudo
      const osc2=ctx.createOscillator(); osc2.type='sawtooth'; osc2.frequency.setValueAtTime(600,t); osc2.frequency.exponentialRampToValueAtTime(100,t+0.06);
      const g3=ctx.createGain(); g3.gain.setValueAtTime(0.35,t); g3.gain.exponentialRampToValueAtTime(0.001,t+0.06);
      osc2.connect(g3); g3.connect(ctx.destination); osc2.start(t); osc2.stop(t+0.06);
    }
    else if(tipo==='erro'){
      // whoosh de vento — sweep descendente
      const osc=ctx.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(320,t); osc.frequency.exponentialRampToValueAtTime(60,t+0.22);
      const g2=ctx.createGain(); g2.gain.setValueAtTime(0.0,t); g2.gain.linearRampToValueAtTime(0.25,t+0.04); g2.gain.exponentialRampToValueAtTime(0.001,t+0.22);
      osc.connect(g2); g2.connect(ctx.destination); osc.start(t); osc.stop(t+0.22);
    }
    else if(tipo==='buff'){
      // tom grave ascendente
      const osc=ctx.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(90,t); osc.frequency.linearRampToValueAtTime(180,t+0.18);
      const g2=ctx.createGain(); g2.gain.setValueAtTime(0.3,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.28);
      osc.connect(g2); g2.connect(ctx.destination); osc.start(t); osc.stop(t+0.28);
    }
    else if(tipo==='cura'){
      // dois tons harmônicos suaves
      [220,330].forEach((freq,i)=>{
        const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=freq;
        const g2=ctx.createGain(); g2.gain.setValueAtTime(0,t+i*0.06); g2.gain.linearRampToValueAtTime(0.18,t+i*0.06+0.04); g2.gain.exponentialRampToValueAtTime(0.001,t+i*0.06+0.3);
        osc.connect(g2); g2.connect(ctx.destination); osc.start(t+i*0.06); osc.stop(t+i*0.06+0.3);
      });
    }
    else if(tipo==='vitoria'){
      // sequência ascendente: 4 notas
      [261,329,392,523].forEach((freq,i)=>{
        const osc=ctx.createOscillator(); osc.type='triangle'; osc.frequency.value=freq;
        const g2=ctx.createGain(); g2.gain.setValueAtTime(0.3,t+i*0.14); g2.gain.exponentialRampToValueAtTime(0.001,t+i*0.14+0.28);
        osc.connect(g2); g2.connect(ctx.destination); osc.start(t+i*0.14); osc.stop(t+i*0.14+0.28);
      });
    }
    else if(tipo==='derrota'){
      // sequência descendente lenta
      [261,220,174,130].forEach((freq,i)=>{
        const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=freq;
        const g2=ctx.createGain(); g2.gain.setValueAtTime(0.35,t+i*0.2); g2.gain.exponentialRampToValueAtTime(0.001,t+i*0.2+0.4);
        osc.connect(g2); g2.connect(ctx.destination); osc.start(t+i*0.2); osc.stop(t+i*0.2+0.4);
      });
    }
    else if(tipo==='metalico'){
      // toque metálico de lâmina/aço — várias parciais inarmônicas (timbre metálico)
      // + um "swoosh" de ruído filtrado por cima, pro golpe de ultimate
      [523, 830, 1108, 1660].forEach((freq,i)=>{
        const osc=ctx.createOscillator(); osc.type='triangle'; osc.frequency.value=freq;
        const g2=ctx.createGain();
        const vol = 0.28/(i+1);
        g2.gain.setValueAtTime(vol,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.9);
        osc.connect(g2); g2.connect(ctx.destination); osc.start(t); osc.stop(t+0.9);
      });
      const buf=ctx.createBuffer(1,ctx.sampleRate*0.3,ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.8);
      const src=ctx.createBufferSource(); src.buffer=buf;
      const filt=ctx.createBiquadFilter(); filt.type='highpass'; filt.frequency.value=2200;
      const g3=ctx.createGain(); g3.gain.setValueAtTime(0.5,t); g3.gain.exponentialRampToValueAtTime(0.001,t+0.3);
      src.connect(filt); filt.connect(g3); g3.connect(ctx.destination); src.start(t);
    }
  } catch(e){}
}

/* =====================================================================
   EFEITOS AMBIENTE (v42) — poeira ambiente, partículas finas, bandeira rasgada
   Gatilho fácil: qualquer uma das 3 chaves abaixo pra false desliga só
   aquela camada na hora (sem precisar mexer em mais nada). Pra desligar
   tudo de uma vez, comente a chamada de iniciarEfeitosAmbiente() no fim
   do arquivo.
   ===================================================================== */
const AMBIENTE = {
  poeira: true,     // Camada 1: rajada de poeira cruzando o campo de vez em quando
  particulas: true, // Camada 2: poeira fina flutuando no ar, quase imperceptível
  bandeira: true,   // Camada 3: bandeira rasgada balançando ao fundo
};

function iniciarEfeitosAmbiente(){
  const canvasFundo = document.getElementById('ambiente-fundo');
  const canvasFrente = document.getElementById('ambiente-frente');
  if(!canvasFundo || !canvasFrente) return;
  const ctxFundo = canvasFundo.getContext('2d');
  const ctxFrente = canvasFrente.getContext('2d');

  function ajustarTamanho(){
    const cena = document.getElementById('cena');
    const rect = cena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    [canvasFundo, canvasFrente].forEach(c=>{
      const w = Math.max(1, Math.round(rect.width*dpr));
      const h = Math.max(1, Math.round(rect.height*dpr));
      if(c.width!==w || c.height!==h){ c.width=w; c.height=h; }
    });
  }
  ajustarTamanho();
  window.addEventListener('resize', ajustarTamanho);

  /* ---------- Camada 2: partículas finas (cinza/poeira flutuando no ar) ----------
     Sobem devagar com uma leve serpenteada horizontal, piscando de opacidade
     bem sutilmente. Nascem de novo por baixo quando saem por cima. */
  const particulas = [];
  const N_PARTICULAS = 20;
  function novaParticula(w,h,y0){
    return {
      x: Math.random()*w,
      y: y0!==undefined ? y0 : Math.random()*h,
      r: (0.5+Math.random()*1.3) * (w/700),
      velY: -(0.045+Math.random()*0.12) * (w/700),
      velX: (Math.random()-0.5)*0.05 * (w/700),
      fase: Math.random()*Math.PI*2,
      velFase: 0.4+Math.random()*0.5,
      ampX: (3+Math.random()*7) * (w/700),
      opacidadeBase: 0.06+Math.random()*0.13,
      tom: Math.random()<0.55 ? '198,182,148' : '140,132,118',
    };
  }

  /* ---------- Camada 1: rajada de poeira cruzando o campo ----------
     Um aglomerado de manchas suaves (gradiente radial) que atravessa
     horizontalmente, direção sorteada a cada vez, bem espaçada no tempo
     (não é tempestade, é só um vento passando de vez em quando). */
  let rajada = null;
  function dispararRajada(){
    const w = canvasFundo.width;
    const daEsquerda = Math.random()<0.5;
    const duracaoSeg = 11+Math.random()*7; // 11-18s pra atravessar
    rajada = {
      progresso: 0,
      duracaoSeg,
      daEsquerda,
      yFrac: 0.56+Math.random()*0.26, // passa na faixa do "chão", nunca no rosto dos personagens
      blobs: Array.from({length: 5+Math.floor(Math.random()*3)}, ()=>({
        offX: (Math.random()-0.5)*0.55,
        offY: (Math.random()-0.5)*0.10,
        r: 0.045+Math.random()*0.06,
      })),
    };
  }
  function agendarProximaRajada(){
    const esperaMs = 10000+Math.random()*15000; // 10-25s entre rajadas
    setTimeout(()=>{
      if(AMBIENTE.poeira && !rajada) dispararRajada();
      agendarProximaRajada();
    }, esperaMs);
  }

  /* ---------- Camada 3: bandeira rasgada balançando ---------- */
  const bandeira = { xFrac:0.07, yFrac:0.34, largFrac:0.075, altFrac:0.16 };
  let tempoBandeira = 0;
  function desenharBandeira(ctx,w,h,t){
    const poleX = bandeira.xFrac*w;
    const topY = bandeira.yFrac*h;
    const flagW = bandeira.largFrac*w;
    const flagH = bandeira.altFrac*h;

    ctx.strokeStyle = 'rgba(18,14,10,0.5)';
    ctx.lineWidth = Math.max(1, w*0.0016);
    ctx.beginPath();
    ctx.moveTo(poleX, topY-flagH*0.22);
    ctx.lineTo(poleX, topY+flagH*1.32);
    ctx.stroke();

    const cols = 14;
    const top=[], bot=[];
    for(let i=0;i<=cols;i++){
      const f = i/cols; // 0 = preso no mastro, 1 = ponta solta
      const amp = flagH*0.075*f; // quase parado perto do mastro, um pouco mais solto na ponta
      const fase = t*1.15 - f*4.6;
      const onda = Math.sin(fase)*amp;
      const x = poleX + flagW*f;
      const desgaste = f>0.5 ? (Math.sin(f*29+1.4)*0.5+0.5)*flagH*0.20*((f-0.5)/0.5) : 0;
      top.push({x, y: topY + onda*0.4});
      bot.push({x, y: topY+flagH + onda - desgaste});
    }
    ctx.fillStyle = 'rgba(34,27,21,0.5)';
    ctx.beginPath();
    ctx.moveTo(top[0].x, top[0].y);
    for(let i=1;i<top.length;i++) ctx.lineTo(top[i].x, top[i].y);
    for(let i=bot.length-1;i>=0;i--) ctx.lineTo(bot[i].x, bot[i].y);
    ctx.closePath();
    ctx.fill();
  }

  let ultimoTs = performance.now();
  function passo(agora){
    requestAnimationFrame(passo);
    const dt = Math.min(0.05, (agora-ultimoTs)/1000);
    ultimoTs = agora;
    const w = canvasFundo.width, h = canvasFundo.height;
    if(w<2||h<2) return;

    ctxFundo.clearRect(0,0,w,h);

    if(AMBIENTE.bandeira){
      tempoBandeira += dt;
      desenharBandeira(ctxFundo, w, h, tempoBandeira);
    }

    if(AMBIENTE.poeira && rajada){
      rajada.progresso += dt/rajada.duracaoSeg;
      if(rajada.progresso>=1){ rajada=null; }
      else {
        const p = rajada.progresso;
        const xCentro = rajada.daEsquerda ? (-0.18+1.36*p)*w : (1.18-1.36*p)*w;
        const fadeMargem = 0.16;
        let alpha = 1;
        if(p<fadeMargem) alpha = p/fadeMargem;
        else if(p>1-fadeMargem) alpha = (1-p)/fadeMargem;
        alpha = Math.max(0,Math.min(1,alpha)) * 0.15; // bem sutil -- só "um vento passando"
        rajada.blobs.forEach(b=>{
          const bx = xCentro + b.offX*w;
          const by = h*(rajada.yFrac+b.offY);
          const r = b.r*w;
          const grad = ctxFundo.createRadialGradient(bx,by,0,bx,by,r);
          grad.addColorStop(0, `rgba(192,174,138,${alpha.toFixed(3)})`);
          grad.addColorStop(1, 'rgba(192,174,138,0)');
          ctxFundo.fillStyle = grad;
          ctxFundo.beginPath();
          ctxFundo.ellipse(bx,by,r,r*0.32,0,0,Math.PI*2);
          ctxFundo.fill();
        });
      }
    }

    ctxFrente.clearRect(0,0,w,h);
    if(AMBIENTE.particulas){
      while(particulas.length < N_PARTICULAS) particulas.push(novaParticula(w,h));
      for(const pt of particulas){
        pt.fase += dt*pt.velFase;
        pt.y += pt.velY*(dt*60);
        pt.x += (pt.velX)*(dt*60) + Math.sin(pt.fase)*pt.ampX*dt;
        if(pt.y < -8 || pt.x<-8 || pt.x>w+8){
          Object.assign(pt, novaParticula(w,h,h+8));
        }
        const piscar = 0.7+0.3*Math.sin(pt.fase*1.6);
        ctxFrente.fillStyle = `rgba(${pt.tom},${(pt.opacidadeBase*piscar).toFixed(3)})`;
        ctxFrente.beginPath();
        ctxFrente.arc(pt.x,pt.y,pt.r,0,Math.PI*2);
        ctxFrente.fill();
      }
    }
  }
  requestAnimationFrame(passo);
  agendarProximaRajada();
}
iniciarEfeitosAmbiente();

/* --- Chroma key em tempo real (remove verde) para qualquer canvas com data-video --- */
function configurarVideosIdle(){
  document.querySelectorAll('.lutador canvas[data-video]').forEach(canvas=>{
    const lutador = canvas.closest('.lutador');
    // descobre o nome da pose pela classe (pose-base, pose-ataque, etc.)
    const poseClasse = [...canvas.classList].find(c=>c.startsWith('pose-'));
    const fallback = lutador.querySelector('.'+poseClasse+'-fallback');
    // poses temporárias não fazem loop (tocam uma vez); idle/rage fazem loop
    const ehLoop = (poseClasse==='pose-base' || poseClasse==='pose-defesa');
    const ctx = canvas.getContext('2d', {willReadFrequently:true});

    const vid = document.createElement('video');
    vid.src = cb(canvas.dataset.video);
    vid.dataset.atual = canvas.dataset.video;
    vid.loop = ehLoop; vid.muted = true; vid.playsInline = true;
    vid.setAttribute('playsinline','');
    vid.preload = 'auto';
    vid.crossOrigin = 'anonymous';
    canvas._vid = vid;        // referência IMEDIATA (antes de qualquer setPose)
    canvas._ehLoop = ehLoop;

    let ok = false;

    const usarFallback = ()=>{
      if(canvas.classList.contains('ativa')){
        canvas.classList.remove('ativa');
        if(fallback) fallback.classList.add('ativa');
      }
      canvas.dataset.falhou='1';
    };

    let proc, pctx;

    function loop(){
      requestAnimationFrame(loop);
      if(!ok) return;
      if(!canvas.classList.contains('ativa')) return;
      if(vid.readyState < 2 || !vid.videoWidth) return;
      if(vid.paused && !vid.ended) vid.play().catch(()=>{});
      if(!proc || proc.width!==vid.videoWidth){
        proc = document.createElement('canvas');
        proc.width = vid.videoWidth; proc.height = vid.videoHeight;
        pctx = proc.getContext('2d', {willReadFrequently:true});
        canvas.width = vid.videoWidth; canvas.height = vid.videoHeight;
      }
      pctx.drawImage(vid,0,0,proc.width,proc.height);
      let frame;
      try{ frame = pctx.getImageData(0,0,proc.width,proc.height); }
      catch(e){ usarFallback(); return; }
      const d = frame.data;
      const W = proc.width, H = proc.height;
      const n = W*H;
      // buffers reaproveitados entre frames (evita realocar/GC toda hora)
      if(!canvas._alphaBuf || canvas._alphaBuf.length!==n){
        canvas._alphaBuf = new Float32Array(n);
        canvas._integral = new Float64Array((W+1)*(H+1));
      }
      const alphaBuf = canvas._alphaBuf;
      const integral = canvas._integral;

      // 1ª passada: alpha CONTÍNUO (não é on/off) baseado em quão "verde de fundo"
      // o pixel parece. Isso deixa bordas em movimento (ex: espada em golpe rápido,
      // que se mistura opticamente com o fundo verde no motion blur) esmaecerem
      // suavemente em vez de sumir de vez ou ficar um bloco sólido verde/cinza.
      const LOW=15, HIGH=55; // faixa de transição (abaixo=opaco, acima=transparente)
      for(let i=0, p=0; i<d.length; i+=4, p++){
        const r=d[i], g=d[i+1], b=d[i+2];
        const score = Math.min(g-r, g-b); // quanto maior, mais "verde de fundo"
        let a;
        if(score<=LOW) a=255;
        else if(score>=HIGH) a=0;
        else a = 255*(1-(score-LOW)/(HIGH-LOW));
        alphaBuf[p]=a;
      }

      // imagem integral (soma acumulada) do alpha, pra consultar a média de uma
      // janela ao redor de cada pixel em O(1)
      for(let y=0;y<H;y++){
        let rowSum=0;
        const rowBase=(y+1)*(W+1);
        const prevRowBase=y*(W+1);
        for(let x=0;x<W;x++){
          rowSum += alphaBuf[y*W+x];
          integral[rowBase+x+1] = integral[prevRowBase+x+1] + rowSum;
        }
      }
      function mediaJanela(cx,cy,raio){
        const x0=cx-raio<0?0:cx-raio, x1=cx+raio>=W?W-1:cx+raio;
        const y0=cy-raio<0?0:cy-raio, y1=cy+raio>=H?H-1:cy+raio;
        const A=integral[y0*(W+1)+x0], B=integral[y0*(W+1)+x1+1];
        const C=integral[(y1+1)*(W+1)+x0], D=integral[(y1+1)*(W+1)+x1+1];
        const area=(x1-x0+1)*(y1-y0+1);
        return (D-B-C+A)/area;
      }

      // 2ª passada, duas janelas na MESMA imagem integral (praticamente de graça,
      // é só mais uma consulta O(1) por pixel):
      // - janela PEQUENA (raio 6): o alpha final vira a média da vizinhança
      //   próxima. Fecha buraquinho isolado DENTRO da armadura (vizinhança
      //   majoritariamente opaca puxa pra opaco) e deixa bordas em movimento
      //   (espada em golpe rápido) esmaecerem suavemente.
      // - janela GRANDE (raio 40): se a vizinhança BEM mais larga ao redor do
      //   pixel é quase toda transparente, é sinal de que esse pixel está
      //   isolado no meio do fundo de verdade (ex.: uma mancha grande e fraca
      //   de verde desbotado bem longe da silhueta) — nesse caso força
      //   transparente total, mesmo que a janela pequena sozinha não bastasse
      //   pra zerar (a mancha pode ser maior que a janela pequena).
      // Perto da silhueta real a janela grande sempre acha bastante opacidade
      // por perto, então isso não mexe no corpo/espada.
      for(let i=0, p=0; i<d.length; i+=4, p++){
        const cx = p % W, cy = (p/W)|0;
        const pequena = mediaJanela(cx,cy,6);
        // usa o MAIOR entre o alpha bruto do próprio pixel e a média da vizinhança,
        // em vez de substituir puro pela média. Isso evita que detalhes finos e
        // isolados (fios de cabelo, franjas, tiras penduradas) sejam "diluídos" pra
        // quase-transparente só por estarem cercados de muito fundo verde na janela
        // 13x13 — mesmo quando o pixel em si já foi corretamente lido como opaco.
        // A cicatrização de buraco (vizinhança majoritariamente opaca puxando um
        // pixel isolado de fundo pra opaco) continua funcionando normalmente.
        let final = Math.max(alphaBuf[p], pequena);
        if(final>0){
          const grande = mediaJanela(cx,cy,40);
          if(grande<15) final = 0;
        }
        const r=d[i], g=d[i+1], b=d[i+2];
        if(final>0 && g-b>10 && g-r>10){
          // reflexo leve de verde em superfície clara/metálica — despill, mantém a cor mais neutra
          d[i+1] = Math.round((r+b)/2);
        }
        d[i+3] = final<0?0:(final>255?255:final);
      }
      ctx.putImageData(frame,0,0);
    }

    vid.addEventListener('loadeddata', ()=>{ ok=true; });
    vid.addEventListener('error', usarFallback);
    loop();
    if(ehLoop){ const p=vid.play(); if(p&&p.catch) p.catch(()=>{}); }

    setTimeout(()=>{ if(!ok && !vid.videoWidth) usarFallback(); }, 6000);
  });
}
configurarVideosIdle();

        alphaBuf[p]=a;
      }
      for(let y=0;y<H;y++){
        let rowSum=0;
        const rowBase=(y+1)*(W+1);
        const prevRowBase=y*(W+1);
        for(let x=0;x<W;x++){
          rowSum += alphaBuf[y*W+x];
          integral[rowBase+x+1] = integral[prevRowBase+x+1] + rowSum;
        }
      }
      function mediaJanela(cx,cy,raio){
        const x0=cx-raio<0?0:cx-raio, x1=cx+raio>=W?W-1:cx+raio;
        const y0=cy-raio<0?0:cy-raio, y1=cy+raio>=H?H-1:cy+raio;
        const A=integral[y0*(W+1)+x0], B=integral[y0*(W+1)+x1+1];
        const C=integral[(y1+1)*(W+1)+x0], D=integral[(y1+1)*(W+1)+x1+1];
        const area=(x1-x0+1)*(y1-y0+1);
        return (D-B-C+A)/area;
      }
      for(let i=0, p=0; i<d.length; i+=4, p++){
        const cx = p % W, cy = (p/W)|0;
        const pequena = mediaJanela(cx,cy,6);
        let final = Math.max(alphaBuf[p], pequena);
        if(final>0){
          const grande = mediaJanela(cx,cy,40);
          if(grande<15) final = 0;
        }
        const r=d[i], g=d[i+1], b=d[i+2];
        if(final>0 && g-b>10 && g-r>10){
          d[i+1] = Math.round((r+b)/2);
        }
        d[i+3] = final<0?0:(final>255?255:final);
      }
      ctx.putImageData(frame,0,0);
    }
    vid.addEventListener('loadeddata', ()=>{ ok=true; });
    loop();
  });
}
configurarEfeitosSangue();

const sangueTimers = {};
function dispararSangue(id){
  const camada = document.getElementById(id);
  if(!camada) return;
  const canvas = camada.querySelector('canvas');
  const vid = canvas && canvas._vid;
  if(!vid) return;
  if(sangueTimers[id]){
    clearTimeout(sangueTimers[id].t);
    clearInterval(sangueTimers[id].i);
    vid.removeEventListener('ended', sangueTimers[id].onEnded);
  }
  camada.classList.add('ativa');
  try{ vid.currentTime = 0; }catch(e){}
  vid.play().catch(()=>{});
  let jaFinalizou = false;
  const finalizar = ()=>{
    if(jaFinalizou) return;
    jaFinalizou = true;
    camada.classList.remove('ativa');
    clearInterval(intervalId);
    vid.removeEventListener('ended', onEnded);
  };
  const onEnded = ()=>finalizar();
  vid.addEventListener('ended', onEnded, {once:true});
  const intervalId = setInterval(()=>{
    if(vid.ended || (vid.duration && vid.currentTime >= vid.duration - 0.02)) finalizar();
  }, 30);
  sangueTimers[id] = {t:setTimeout(finalizar, 6000), i:intervalId, onEnded};
}
function dispararSangueCritico(){ dispararSangue('sangue-critico'); }

/* v44: "queda" de sangue -- depois do jorro filmado (vídeo, realista mas
   preso a um ponto fixo), pingos procedurais nascem no MESMO ponto e caem
   de verdade até perto do chão, com aceleração e leque de queda, sumindo
   num pequeno respingo ao "pousar". Corrige a sensação de sangue "grudado
   na tela" -- agora ele continua se movendo depois do impacto inicial. */
function quedaSangue(id){
  const canvas = document.getElementById(id);
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = Math.max(1, Math.round(rect.width*dpr));
  const h = Math.max(1, Math.round(rect.height*dpr));
  if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
  const ctx = canvas.getContext('2d');

  const tonsSangue = ['#5e0a08','#7a0f0c','#8b0000','#4a0705','#6b0d0a'];
  const gotas = [];
  const nGotas = 4+Math.floor(Math.random()*3);
  for(let i=0;i<nGotas;i++){
    gotas.push({
      x: w*(0.35+Math.random()*0.3),
      y: 0,
      vx: (Math.random()-0.5)*w*0.12,
      vy: h*(0.10+Math.random()*0.10),
      r: (0.025+Math.random()*0.02)*w,
      cor: tonsSangue[(Math.random()*tonsSangue.length)|0],
      pousou: false,
      vidaPoca: 1,
    });
  }
  const g = h*2.6;
  let ultimo = performance.now();
  if(canvas._raf) cancelAnimationFrame(canvas._raf);

  function passo(agora){
    const dt = Math.min(0.04,(agora-ultimo)/1000);
    ultimo = agora;
    ctx.clearRect(0,0,w,h);
    let algumaViva = false;
    for(const gt of gotas){
      if(!gt.pousou){
        gt.vy += g*dt;
        gt.x += gt.vx*dt;
        gt.y += gt.vy*dt;
        if(gt.y >= h-gt.r){ gt.y = h-gt.r; gt.pousou=true; }
        algumaViva = true;
        ctx.globalAlpha = 1;
        ctx.fillStyle = gt.cor;
        ctx.beginPath();
        ctx.ellipse(gt.x,gt.y,gt.r*0.7,gt.r*1.15,0,0,Math.PI*2);
        ctx.fill();
      } else if(gt.vidaPoca>0){
        gt.vidaPoca -= dt*0.9;
        algumaViva = true;
        ctx.globalAlpha = Math.max(0,gt.vidaPoca)*0.7;
        ctx.fillStyle = gt.cor;
        ctx.beginPath();
        ctx.ellipse(gt.x,gt.y,gt.r*1.3,gt.r*0.5,0,0,Math.PI*2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if(algumaViva) canvas._raf = requestAnimationFrame(passo);
    else { ctx.clearRect(0,0,w,h); canvas._raf = null; }
  }
  canvas._raf = requestAnimationFrame(passo);
}
function dispararSangueKronk(){ dispararSangue('sangue-corpo-kronk'); quedaSangue('sangue-queda-kronk'); }
function dispararSangueBryne(){ dispararSangue('sangue-corpo-bryne'); quedaSangue('sangue-queda-bryne'); }

/* v52: REFEITO -- a versão anterior desenhava círculos sólidos com opacidade
   lisa (ctx.arc + fillStyle simples), exatamente a "bolinha transparente"
   sem graça que foi criticada, e com razão: nada a ver com o capricho usado
   na poeira ambiente e no sangue. Agora cada partícula é um gradiente
   radial (centro denso, borda esmaecendo pra transparente -- mesma técnica
   da rajada de poeira ambiente), e a nuvem toda CRESCE e DISSIPA ao longo
   da vida (como poeira real se expandindo no ar), em vez de bolinhas de
   tamanho fixo só ficando transparentes. Duas camadas: uma nuvem que sobe
   (poucos blobs maiores, mais lentos) e uma "rasteira" que se espalha
   grudada no chão (mais blobs, achatados, quase não sobem). */
function poeiraImpacto(id, intensidade){
  const canvas = document.getElementById(id);
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = Math.max(1, Math.round(rect.width*dpr));
  const h = Math.max(1, Math.round(rect.height*dpr));
  if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
  const ctx = canvas.getContext('2d');

  const tons = ['214,196,158','196,178,140','174,156,118','150,132,98','226,210,176'];
  const escala = 0.55+intensidade*0.55;
  const blobs = [];

  // nuvem que sobe: poucos blobs, maiores, mais lentos, vida mais longa
  const nSubindo = Math.max(2, Math.round((4+Math.random()*3)*intensidade));
  for(let i=0;i<nSubindo;i++){
    const ang = -Math.PI/2 + (Math.random()-0.5)*Math.PI*0.85;
    const vel = (0.10+Math.random()*0.14)*h*escala;
    blobs.push({
      x: w*(0.34+Math.random()*0.32),
      y: h*0.92,
      vx: Math.cos(ang)*vel*0.5,
      vy: Math.sin(ang)*vel,
      r0: (0.045+Math.random()*0.04)*w*escala,
      rGrow: 2.2+Math.random()*1.4,
      achatar: 1,
      tom: tons[(Math.random()*tons.length)|0],
      opacidadeBase: 0.20+Math.random()*0.13,
      vida: 1,
      velVida: 0.42+Math.random()*0.22,
    });
  }
  // rasteira no chão: mais blobs, achatados (elipses largas e baixas), quase não sobem, se espalham pros lados
  const nRasteira = Math.max(3, Math.round((6+Math.random()*4)*intensidade));
  for(let i=0;i<nRasteira;i++){
    const lado = (Math.random()<0.5?-1:1);
    blobs.push({
      x: w*(0.5+lado*Math.random()*0.18),
      y: h*(0.95+Math.random()*0.04),
      vx: lado*(0.05+Math.random()*0.10)*w*escala,
      vy: -(0.01+Math.random()*0.03)*h*escala,
      r0: (0.05+Math.random()*0.045)*w*escala,
      rGrow: 1.6+Math.random()*0.9,
      achatar: 0.38, // bem achatada, rente ao chão
      tom: tons[(Math.random()*tons.length)|0],
      opacidadeBase: 0.16+Math.random()*0.11,
      vida: 1,
      velVida: 0.5+Math.random()*0.25,
    });
  }

  const g = h*0.55; // gravidade bem suave -- poeira é leve, paira e some, não cai como pedra
  let ultimo = performance.now();
  if(canvas._raf) cancelAnimationFrame(canvas._raf);

  function passo(agora){
    const dt = Math.min(0.04,(agora-ultimo)/1000);
    ultimo = agora;
    ctx.clearRect(0,0,w,h);
    let algumaViva = false;
    for(const b of blobs){
      b.vy += g*dt;
      b.vx *= (1-dt*1.4); // arrasto do ar -- desacelera rápido, não é balístico
      b.vy *= (1-dt*0.5);
      b.x += b.vx*dt;
      b.y += b.vy*dt;
      b.vida -= dt*b.velVida;
      if(b.vida>0){
        algumaViva = true;
        const progresso = 1-b.vida;
        const r = b.r0*(1+progresso*b.rGrow); // cresce = dissipa, igual poeira real
        const alpha = b.opacidadeBase*b.vida;
        const grad = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r);
        grad.addColorStop(0, `rgba(${b.tom},${alpha.toFixed(3)})`);
        grad.addColorStop(0.55, `rgba(${b.tom},${(alpha*0.5).toFixed(3)})`);
        grad.addColorStop(1, `rgba(${b.tom},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(b.x,b.y,r,r*b.achatar,0,0,Math.PI*2);
        ctx.fill();
      }
    }
    if(algumaViva) canvas._raf = requestAnimationFrame(passo);
    else { ctx.clearRect(0,0,w,h); canvas._raf = null; }
  }
  canvas._raf = requestAnimationFrame(passo);
}
function poeiraImpactoKronk(){ poeiraImpacto('poeira-impacto-kronk', 1); }
function poeiraImpactoBryne(intensidade){ poeiraImpacto('poeira-impacto-bryne', intensidade||0.55); }
